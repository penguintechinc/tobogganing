[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/auth",
    "crates/proxy",
    "crates/firewall",
    "crates/ports",
    "crates/mirror",
    "crates/config",
    "crates/wireguard",
    "crates/hub-router",
    "crates/syslog",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false
repository = "https://github.com/penguintechinc/tobogganing"

# Exact-pinned versions only (no `^`/`~`/bare `*`) per org dependency-pinning
# policy. Member crates consume these via `dep.workspace = true` so every
# crate in the workspace resolves to a single shared version.
[workspace.dependencies]
# core
async-trait = "=0.1.92"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
jsonwebtoken = "=11.0.0"
figment = "=0.10.19"
clap = "=4.6.6"
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = "=1.53.1"
tokio-util = "=0.7.19"
# Zero-copy UDP packet framing in hub-router-ports' listener hot path
# (backend-rust.md anti-pattern: no `Vec<u8>` clones for packet data) —
# pinned to the version already resolved transitively via reqwest/hyper so
# adding it as a direct dependency doesn't perturb Cargo.lock.
bytes = "=1.12.1"
# hub-router-firewall's ip_range rule (CIDR containment), url_pattern rule
# (regex), and http(s):// target hostname extraction — all three already
# resolved transitively (ipnet via no current direct consumer but pinned
# here ahead of use; regex via tracing-subscriber's env-filter; url via
# reqwest) so pinning these exact versions as direct dependencies doesn't
# perturb Cargo.lock.
ipnet = "=2.12.2"
regex = "=1.13.1"
url = "=2.5.8"
# Randomized refresh-interval jitter (hub-router-firewall's Manager,
# mirroring hub-router-auth's identical non-cryptographic scheduling-jitter
# use) — already resolved transitively via the same dependency graph as
# engines/testserver-rs's `rand::rng()` use.
rand = "=0.9.5"
# hub-router-syslog's `Logger::hostname_or_fallback` — the syslog wire
# frame's `hostname` field, replacing Go's DNS-based "resolution" bug
# (a CNAME lookup of the literal string "localhost") with a real
# `gethostname(2)` call. Not previously a workspace dependency; MIT
# licensed, no transitive deps beyond platform libc bindings.
hostname = "=0.4.2"

# transport
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
reqwest = { version = "=0.13.4", default-features = false }
rustls = { version = "=0.23.43", default-features = false }

# http framework
axum = "=0.8.7"
tower = "=0.5.3"
tower-http = "=0.7.1"

# auth
# penguin-aaa isn't published to crates.io yet — pinned to an immutable git
# tag per the org's dependency-pinning policy for pre-registry internal
# packages (mirrors agents/node-agent's and engines/testserver-rs's
# identical pin).
penguin-aaa = { git = "https://github.com/penguintechinc/penguin-libs", tag = "rust-aaa-v0.1.0", version = "=0.1.0" }
# EC P-256 keypair generation for ES256 JWT tests only (mirrors
# testserver-rs's pin exactly) — never used outside #[cfg(test)]/tests/.
p256 = "=0.13.2"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
# HMAC-SHA256 token forging for the HS256 alg-confusion regression tests
# only (mirrors testserver-rs's/penguin-aaa's own test-suite pins exactly)
# — never used outside #[cfg(test)]/tests/.
hmac = "=0.12.1"
sha2 = "=0.10.9"

# observability — OTLP triad (logs/metrics/traces) + Prometheus secondary
# scrape surface, same pins as engines/testserver-rs for consistency.
opentelemetry = "=0.33.0"
opentelemetry-otlp = "=0.33.0"
opentelemetry_sdk = "=0.33.0"
tracing-opentelemetry = "=0.34.0"
opentelemetry-appender-tracing = "=0.33.0"
metrics = "=0.24.6"
metrics-exporter-prometheus = "=0.18.3"
# OTLP collector proto/tonic stubs — dev-dependency only, for an in-process
# mock OTLP collector (tests/telemetry_smoke.rs) that asserts real export
# traffic rather than trusting a "no error" absence-of-failure signal.
opentelemetry-proto = "=0.33.0"
tokio-stream = "=0.1.19"
wiremock = "=0.6.5"

# workspace-internal crates — explicit `version` alongside `path` even
# though nothing outside this workspace ever resolves them from a registry;
# omitting it makes cargo-deny's `bans.wildcards = "deny"` treat every
# `workspace = true` consumer as an unpinned wildcard dependency.
hub-router-common = { path = "crates/common", version = "0.1.0" }
hub-router-config = { path = "crates/config", version = "0.1.0" }
hub-router-auth = { path = "crates/auth", version = "0.1.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
