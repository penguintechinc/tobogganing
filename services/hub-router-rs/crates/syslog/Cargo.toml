[package]
name = "hub-router-syslog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
hub-router-common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
# OS hostname lookup for the syslog frame's `hostname` field — see
# root Cargo.toml's `[workspace.dependencies]` comment.
hostname = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
