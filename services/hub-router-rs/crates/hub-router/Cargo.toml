[package]
name = "hub-router"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "hub_router"
path = "src/lib.rs"

[[bin]]
name = "hub-router"
path = "src/main.rs"

[dependencies]
hub-router-common = { workspace = true }
hub-router-config = { workspace = true }
hub-router-auth = { workspace = true }
penguin-aaa = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
# Feature-unifies hub-router-auth's test-only PublicKeyCache::inject_for_test
# into this crate's test builds (never a production build — see that
# crate's Cargo.toml).
hub-router-auth = { workspace = true, features = ["test-util"] }
# EC P-256 keypair generation for the auth-middleware integration tests —
# never used outside tests/.
p256 = { workspace = true }
rand_core = { workspace = true }
# In-process mock OTLP collector for tests/telemetry_smoke.rs.
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace", "metrics", "logs"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["router", "transport"] }
reqwest = { workspace = true, features = ["json"] }
