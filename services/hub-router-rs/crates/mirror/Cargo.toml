[package]
name = "hub-router-mirror"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
hub-router-common = { workspace = true }
# Zero-copy buffer for packet payloads in MirrorPacket::data (backend-rust.md:
# no Vec<u8> clones in packet hot paths).
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
