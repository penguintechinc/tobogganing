# Alembic configuration for Tobogganing Hub API
# Run migrations: alembic -c database/migrations/alembic.ini upgrade head

[alembic]
# Path to migration scripts, relative to this file
script_location = .

# DB URI is read from the environment at runtime (see env.py).
# Override here for offline mode only:
# sqlalchemy.url = mysql+pymysql://user:pass@localhost/tobogganing

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
