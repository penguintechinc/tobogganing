# Default values for netsvcs-dns DaemonSet chart (production-safe baseline)
# Per-environment overrides in alpha.yml, beta.yml, gamma.yml, production.yml

image:
  repository: ghcr.io/penguintechinc/tobogganing/netsvcs-dns
  tag: latest  # Override in environment-specific values
  pullPolicy: IfNotPresent

# DaemonSet configuration
daemonset:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

# Resource limits/requests (production defaults; alpha/beta override lower)
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Service configuration
service:
  type: ClusterIP
  ports:
    doh:
      port: 8080
      name: http-doh
    dot:
      port: 853
      name: tcp-dot
    metrics:
      port: 9090
      name: metrics

# Health probe configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# Environment variables (secrets referenced via secret refs, never hardcoded)
env:
  - name: BIND_HOST
    value: "0.0.0.0"
  - name: DOH_PORT
    value: "8080"
  - name: DOT_PORT
    value: "853"
  - name: METRICS_PORT
    value: "9090"
  - name: CONTROL_PLANE_GRPC_ADDR
    value: "hub-api-grpc:50051"  # Override in environment values
  - name: GRPC_TLS_CA_PATH
    value: "/etc/tls/ca/ca.crt"
  - name: GRPC_INSECURE_DEV_FLAG
    value: "false"
  - name: CACHE_URL
    value: "redis://valkey:6379"
  - name: CONFIG_CACHE_DIR
    value: "/tmp/dns-resolver-cache"
  - name: ENROLLMENT_BOOTSTRAP_TOKEN
    valueFrom:
      secretKeyRef:
        name: netsvcs-dns-bootstrap
        key: token
  - name: VERSION
    value: "0.1.0"

# Security context (mandatory: non-root, read-only FS, drop all caps)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node affinity (optional)
affinity: {}

# Tolerations (optional)
tolerations: []

# Labels
labels:
  app: netsvcs-dns
  component: dns-resolver
