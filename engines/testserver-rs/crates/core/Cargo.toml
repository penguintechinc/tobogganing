[package]
name = "testserver-core"
description = "Shared config, error types, input validation, and JWT auth for the tobogganing testserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "testserver_core"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
regex = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
jsonwebtoken = { workspace = true, default-features = true, features = ["rust_crypto"] }

[dev-dependencies]
serde_json = { workspace = true }
