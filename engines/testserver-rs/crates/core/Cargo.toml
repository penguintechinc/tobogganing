[package]
name = "testserver-core"
description = "Shared config, error types, input validation, and JWT auth for the tobogganing testserver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "testserver_core"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
regex = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
penguin-aaa = { workspace = true }
# Used only for validate_target's anti-DNS-rebind hostname resolution
# (tokio::net::lookup_host) — see validation.rs.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "macros"] }
# EC P-256 keypair generation for ES256 JWT tests only.
p256 = { workspace = true }
rand_core = { workspace = true }
# HMAC-SHA256 token forging for the HS256 alg-confusion regression test
# only — never used outside #[cfg(test)].
hmac = { workspace = true }
sha2 = { workspace = true }
