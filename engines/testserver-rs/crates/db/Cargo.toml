[package]
name = "testserver-db"
description = "SeaORM persistence layer for the tobogganing testserver: API-key lookups and probe-result storage across PostgreSQL/MySQL/SQLite via DB_TYPE, replacing the Go implementation's GORM layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "testserver_db"
path = "src/lib.rs"

[dependencies]
testserver-core = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sea-orm = { workspace = true, features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sea-orm = { workspace = true, features = ["mock"] }
