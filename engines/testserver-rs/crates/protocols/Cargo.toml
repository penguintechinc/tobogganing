[package]
name = "testserver-protocols"
description = "Diagnostic probe implementations (HTTP, TCP/TLS, UDP/DNS) for the tobogganing testserver — port of engines/testserver/internal/protocols (Go)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "testserver_protocols"
path = "src/lib.rs"

[dependencies]
testserver-core = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "rt"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12", "logging"] }
webpki-roots = { workspace = true }
rustls-pki-types = { workspace = true }
hickory-resolver = { workspace = true, features = ["tokio"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
