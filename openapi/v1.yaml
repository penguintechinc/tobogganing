      description: "\nRequest body (optional):\n    variables: dict - sample variables\
        \ for rendering\n\nReturns:\n    200 with BlockPagePreviewDTO (html + variables\
        \ used)\n    403 if unauthorized or not found"
      operationId: post_preview_page
      parameters:
      - in: path
        name: page_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Preview a block page with sample variable rendering.
  /api/v1/sase/blockpages/pages/{page_id}/publish:
    post:
      description: "\nReturns:\n    200 with published BlockPageDTO\n    402 if feature\
        \ disabled\n    403 if unauthorized or not found"
      operationId: post_publish_page
      parameters:
      - in: path
        name: page_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Publish a draft page to live (bumps version).
  /api/v1/sase/blockpages/routes:
    get:
      description: "\nReturns:\n    200 with list of BlockRouteDTO\n    402 if feature\
        \ disabled\n    403 if unauthorized"
      operationId: get_get_routes
      parameters: []
      responses: {}
      summary: Get all block routes for the authenticated tenant.
    put:
      description: "\nRequest body:\n    routes: list of route dicts with source_type,\
        \ destination_kind, page_id/external_url, metadata\n\nReturns:\n    200 with\
        \ list of updated BlockRouteDTO\n    400 if invalid input\n    402 if feature\
        \ disabled\n    403 if unauthorized"
      operationId: put_upsert_routes
      parameters: []
      responses: {}
      summary: Set or update block routes (full upsert).
  /api/v1/sase/swg/categories:
    post:
      description: "\nRequest body:\n    {\n        \"domain\": \"example.com\",\n\
        \        \"category\": \"blocked-shopping\"\n    }\n\nTenant is derived from\
        \ authenticated JWT claims. Request body tenant\nfield (if present) must match\
        \ the authenticated tenant or is rejected.\n\nReturns:\n    200 if successful\n\
        \    400 if invalid input\n    403 if tenant mismatch or unauthorized"
      operationId: post_upsert_category
      parameters: []
      responses: {}
      summary: Upsert a custom category for a domain (authenticated tenant only).
  /api/v1/sase/swg/lookup:
    get:
      description: "\nQuery parameters:\n    domain: Domain to look up (required).\n\
        \nDerives tenant, user_id, and group_ids from authenticated JWT claims only.\n\
        X-* headers are not trusted for authorization context.\n\nReturns:\n    200\
        \ with LookupResultDTO if successful\n    400 if domain parameter missing\
        \ or invalid\n    402 if feature disabled\n    403 if unauthorized"
      operationId: get_lookup_domain
      parameters: []
      responses: {}
      summary: Look up a domain and return its enforcement action.
  /api/v1/sase/swg/policy:
    get:
      description: "\nReturns only policies for the authenticated tenant (derived\
        \ from JWT claims).\n\nReturns:\n    200 with list of policies scoped to authenticated\
        \ tenant\n    403 if unauthorized"
      operationId: get_get_policies
      parameters: []
      responses: {}
      summary: Get all category policies for authenticated tenant.
    put:
      description: "\nRequest body:\n    {\n        \"scope\": \"user|group|tenant\"\
        ,\n        \"scope_id\": \"user123\" (optional),\n        \"category\": \"\
        gambling\",\n        \"action\": \"block\"\n    }\n\nTenant is derived from\
        \ authenticated JWT claims. Any tenant field in\nthe request body must match\
        \ the authenticated tenant or is rejected.\n\nReturns:\n    200 if successful\n\
        \    400 if invalid input\n    403 if tenant mismatch or unauthorized"
      operationId: put_set_policy
      parameters: []
      responses: {}
      summary: Set a category policy for authenticated tenant.
  /api/v1/sase/swg/radix:
    get:
      description: "\nReturns the compiled domain category radix tree as a JSON artifact,\n\
        which the data plane pulls daily for inline lookup.\n\nReturns:\n    200 with\
        \ radix artifact and version\n    403 if unauthorized (machine JWT missing\
        \ swg:read scope)\n    500 if radix not available"
      operationId: get_get_radix_artifact
      parameters: []
      responses: {}
      summary: Get the serialized radix tree artifact for data-plane consumption.
  /api/v1/sdwan/clients:
    get:
      description: "\nRequires valid JWT with clients:read scope.\n\nReturns:\n  \
        \  JSON response with list of clients."
      operationId: get_list_clients
      parameters: []
      responses: {}
      summary: List all clients for the tenant.
    post:
      description: "\nRequires ENROLLMENT_BOOTSTRAP_TOKEN for Phase-0 enrollment.\n\
        \nReturns:\n    JSON response with client_id and api_key."
      operationId: post_register_client
      parameters: []
      responses: {}
      summary: Register a new client with enrollment token.
  /api/v1/sdwan/clients/headends/{headend_id}/metrics:
    post:
      description: "\nRequires valid machine-JWT with metrics:write scope.\nVerifies\
        \ the authenticated cluster matches the headend_id in path.\n\nArgs:\n   \
        \ headend_id: Headend/cluster identifier.\n\nReturns:\n    JSON response with\
        \ status."
      operationId: post_submit_headend_metrics
      parameters:
      - in: path
        name: headend_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Submit metrics from a headend/cluster.
  /api/v1/sdwan/clients/{client_id}/config:
    get:
      description: "\nRequires valid API key for the client.\n\nArgs:\n    client_id:\
        \ Client identifier.\n\nReturns:\n    JSON response with client configuration."
      operationId: get_get_client_config
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Get configuration for a client.
  /api/v1/sdwan/clients/{client_id}/metrics:
    post:
      description: "\nRequires valid API key.\n\nArgs:\n    client_id: Client identifier.\n\
        \nReturns:\n    JSON response with status."
      operationId: post_submit_client_metrics
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Submit metrics from a client.
  /api/v1/sdwan/clients/{client_id}/rotate-key:
    post:
      description: "\nRequires valid current API key.\n\nArgs:\n    client_id: Client\
        \ identifier.\n\nReturns:\n    JSON response with new API key."
      operationId: post_rotate_client_key
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Rotate API key for a client.
  /api/v1/sdwan/clients/{client_id}/tunnel-config:
    put:
      description: "\nRequires valid API key or admin JWT.\n\nArgs:\n    client_id:\
        \ Client identifier.\n\nReturns:\n    JSON response with updated configuration."
      operationId: put_update_tunnel_config
      parameters:
      - in: path
        name: client_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Update tunnel configuration for a client.
  /api/v1/sdwan/clusters:
    get:
      description: "\nRequires valid JWT with clusters:read scope.\n\nReturns:\n \
        \   JSON response with list of clusters."
      operationId: get_list_clusters
      parameters: []
      responses: {}
      summary: List all clusters for the tenant.
    post:
      description: "\nRequires ENROLLMENT_BOOTSTRAP_TOKEN for Phase-0 enrollment.\n\
        Enforces Professional tier for >5 node clusters.\n\nReturns:\n    JSON response\
        \ with cluster_id and status."
      operationId: post_register_cluster
      parameters: []
      responses: {}
      summary: Register a new cluster with enrollment token.
  /api/v1/sdwan/clusters/{cluster_id}/headend-config:
    get:
      description: "\nRequires per-cluster API key authentication.\n\nArgs:\n    cluster_id:\
        \ Cluster identifier.\n\nReturns:\n    JSON response with headend configuration."
      operationId: get_get_headend_config
      parameters:
      - in: path
        name: cluster_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Get complete headend configuration for a cluster.
  /api/v1/sdwan/clusters/{cluster_id}/heartbeat:
    post:
      description: "\nRequires per-cluster API key authentication.\n\nArgs:\n    cluster_id:\
        \ Cluster identifier.\n\nReturns:\n    JSON response with status."
      operationId: post_cluster_heartbeat
      parameters:
      - in: path
        name: cluster_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Update cluster heartbeat with client count.
  /api/v1/sdwan/status:
    get:
      description: "\nReturns aggregate metrics for clusters and clients.\n\nReturns:\n\
        \    JSON response with service status and metrics."
      operationId: get_get_status
      parameters: []
      responses: {}
      summary: Get overall SASE service status.
  /api/v1/sdwan/wireguard/keys:
    post:
      description: "\nRequires tenant claim (for authorization) and node authentication\
        \ via\ncluster_manager (for headend/cluster nodes) or client_registry (for\
        \ clients).\n\nRequest body:\n{\n    \"node_id\": \"cluster-1\",\n    \"node_type\"\
        : \"kubernetes_node\" | \"raw_compute\" | \"headend\" | \"client_docker\"\
        \ | \"client_native\",\n    \"api_key\": \"secret-api-key\"\n}\n\nReturns:\n\
        \    JSON response with WireGuard keys, IP address, and X.509 certificate."
      operationId: post_generate_wireguard_keys
      parameters: []
      responses: {}
      summary: Generate WireGuard keys and certificates for authenticated nodes.
  /api/v1/sdwan/wireguard/keys/{node_id}:
    delete:
      description: "\nRequires tenant claim and valid Bearer token.\n\nPath parameter:\n\
        \    node_id: Node identifier to revoke.\n\nReturns:\n    JSON response indicating\
        \ success or failure."
      operationId: delete_revoke_wireguard_keys
      parameters:
      - in: path
        name: node_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Revoke WireGuard keys for a specific node.
  /api/v1/sdwan/wireguard/peers:
    get:
      description: "\nUsed by headend servers to fetch the current peer list for\n\
        configuring WireGuard interfaces.\n\nRequires tenant claim and valid Bearer\
        \ token.\n\nReturns:\n    JSON response with list of peers (node_id, public_key,\
        \ ip_address)."
      operationId: get_get_wireguard_peers
      parameters: []
      responses: {}
      summary: Get all WireGuard peer configurations.
  /api/v1/threatintel/blocklist:
    get:
      description: "\nQuery parameters:\n    indicator_type: Optional filter (ip/domain/url/hash)\n\
        \    source: Optional filter by source\n    limit: Page size (default 50,\
        \ max 200)\n    offset: Pagination offset (default 0)\n\nReturns:\n    JSON\
        \ response with list of entries and meta (200)."
      operationId: get_list_blocklist_entries
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: List blocklist entries response.
                properties:
                  entries:
                    items:
                      $ref: '#/components/schemas/BlocklistEntryResponse'
                    title: Entries
                    type: array
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                required:
                - entries
                - meta
                title: BlocklistEntriesListResponse
                type: object
          description: List blocklist entries response.
      summary: List blocklist entries for the tenant, with optional filters and pagination.
      tags:
      - threatintel
    post:
      description: "\nRequest body:\n{\n    \"indicator_type\": \"domain\",\n    \"\
        value\": \"malicious.example.com\",\n    \"source\": \"manual\",\n    \"confidence\"\
        : 100,\n    \"ttl\": 86400\n}\n\nReturns:\n    JSON response with created\
        \ entry (201) or error (400/500)."
      operationId: post_add_blocklist_entry
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Create blocklist entry request DTO.
              properties:
                confidence:
                  default: 100
                  title: Confidence
                  type: integer
                indicator_type:
                  title: Indicator Type
                  type: string
                source:
                  default: manual
                  title: Source
                  type: string
                ttl:
                  default: 86400
                  title: Ttl
                  type: integer
                value:
                  title: Value
                  type: string
              required:
              - indicator_type
              - value
              title: CreateBlocklistEntryRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Blocklist entry response DTO.
                properties:
                  active:
                    title: Active
                    type: boolean
                  confidence:
                    title: Confidence
                    type: integer
                  created_at:
                    title: Created At
                    type: string
                  id:
                    title: Id
                    type: string
                  indicator_type:
                    title: Indicator Type
                    type: string
                  source:
                    title: Source
                    type: string
                  updated_at:
                    title: Updated At
                    type: string
                  value:
                    title: Value
                    type: string
                required:
                - id
                - indicator_type
                - value
                - source
                - confidence
                - active
                - created_at
                - updated_at
                title: BlocklistEntryResponse
                type: object
          description: Blocklist entry response DTO.
      summary: Add a manual blocklist entry for the tenant.
      tags:
      - threatintel
  /api/v1/threatintel/blocklist/check:
    get:
      description: "\nQuery parameters:\n    type: IOC type (ip, domain, url, hash)\n\
        \    value: IOC value to check\n\nReturns:\n    200 with verdict DTO if found\n\
        \    404 if not found or feature disabled\n    400 if invalid IOC type"
      operationId: get_check_ioc
      parameters: []
      responses: {}
      summary: Check if an IOC is in the SASE blocklist.
  /api/v1/threatintel/blocklist/{entry_id}:
    delete:
      description: "\nArgs:\n    entry_id: Entry ID to remove.\n\nReturns:\n    JSON\
        \ response with removal status (200) or error (404/500)."
      operationId: delete_remove_blocklist_entry
      parameters:
      - in: path
        name: entry_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Generic message response DTO for blocklist management.
                properties:
                  message:
                    title: Message
                    type: string
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                required:
                - message
                - meta
                title: BlocklistMessageResponse
                type: object
          description: Generic message response DTO for blocklist management.
      summary: Remove a blocklist entry for the tenant.
      tags:
      - threatintel
  /api/v1/threatintel/feeds:
    get:
      description: "\nReturns:\n    JSON response with list of feed sources and meta."
      operationId: get_list_feed_sources
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: List feed sources response.
                properties:
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  sources:
                    items:
                      $ref: '#/components/schemas/FeedSourceResponse'
                    title: Sources
                    type: array
                required:
                - sources
                - meta
                title: FeedSourcesListResponse
                type: object
          description: List feed sources response.
      summary: List all threat-intel feed sources for the tenant.
      tags:
      - threatintel
    post:
      description: "\nRequest body:\n{\n    \"name\": \"my-misp\",\n    \"source_type\"\
        : \"misp\",\n    \"url\": \"https://misp.example.com/export.json\",\n    \"\
        enabled\": true\n}\n\nReturns:\n    JSON response with created feed source\
        \ (201) or error (400/500)."
      operationId: post_create_feed_source
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Create feed source request DTO.
              properties:
                enabled:
                  default: true
                  title: Enabled
                  type: boolean
                name:
                  title: Name
                  type: string
                source_type:
                  title: Source Type
                  type: string
                url:
                  title: Url
                  type: string
              required:
              - name
              - source_type
              - url
              title: CreateFeedSourceRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Feed source response DTO.
                properties:
                  created_at:
                    title: Created At
                    type: string
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: string
                  last_refresh_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Refresh At
                  last_refresh_error:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Refresh Error
                  last_refresh_status:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Refresh Status
                  name:
                    title: Name
                    type: string
                  source_type:
                    title: Source Type
                    type: string
                  url:
                    title: Url
                    type: string
                required:
                - id
                - name
                - source_type
                - url
                - enabled
                - last_refresh_at
                - last_refresh_status
                - last_refresh_error
                - created_at
                title: FeedSourceResponse
                type: object
          description: Feed source response DTO.
      summary: Create a new threat-intel feed source.
      tags:
      - threatintel
  /api/v1/threatintel/feeds/{source_id}:
    delete:
      description: "\nArgs:\n    source_id: Feed source ID to delete.\n\nReturns:\n\
        \    JSON response with deletion status (200) or error (404/500)."
      operationId: delete_delete_feed_source
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Generic message response DTO.
                properties:
                  message:
                    title: Message
                    type: string
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                required:
                - message
                - meta
                title: MessageResponse
                type: object
          description: Generic message response DTO.
      summary: Delete a threat-intel feed source.
      tags:
      - threatintel
  /api/v1/threatintel/feeds/{source_id}/refresh:
    post:
      description: "\nFetches the source URL, parses it per source_type, and stores\
        \ every\nindicator into threat_indicators for the tenant. Fetch/parse failures\n\
        are recorded on the source (last_refresh_status=\"failed\") rather than\n\
        raised, so a bad feed never 500s the caller.\n\nArgs:\n    source_id: Feed\
        \ source ID to refresh.\n\nReturns:\n    JSON response with refresh stats\
        \ (200) or error (404/500)."
      operationId: post_refresh_feed_source
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Feed source refresh result response DTO.
                properties:
                  added:
                    title: Added
                    type: integer
                  errors:
                    title: Errors
                    type: integer
                  id:
                    title: Id
                    type: string
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  status:
                    title: Status
                    type: string
                  updated:
                    title: Updated
                    type: integer
                required:
                - id
                - status
                - added
                - updated
                - errors
                - meta
                title: RefreshResultResponse
                type: object
          description: Feed source refresh result response DTO.
      summary: Trigger an immediate ingest for a threat-intel feed source.
      tags:
      - threatintel
  /api/v1/wireguard/peers:
    get:
      description: "\nRequires machine-JWT authentication (or legacy static token\
        \ if flag OFF).\nReturns peer configurations for the authenticated tenant.\n\
        \nReturns:\n    - 200: {peers: [...], total: N, meta: {...}}\n    - 401: {error:\
        \ \"...\"} if auth fails\n    - 500: {error: \"...\"} on server error"
      operationId: get_get_wireguard_peers
      parameters: []
      responses: {}
      summary: Get all WireGuard peer configurations for headend consumption.
  /api/v1/ziti/api/v1/ziti/health:
    get:
      description: "\nReturns:\n    Tuple of (response dict, HTTP status code)."
