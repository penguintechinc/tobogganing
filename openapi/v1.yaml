components:
  schemas:
    BlocklistEntryResponse:
      description: Blocklist entry response DTO.
      properties:
        active:
          title: Active
          type: boolean
        confidence:
          title: Confidence
          type: integer
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        indicator_type:
          title: Indicator Type
          type: string
        source:
          title: Source
          type: string
        updated_at:
          title: Updated At
          type: string
        value:
          title: Value
          type: string
      required:
      - id
      - indicator_type
      - value
      - source
      - confidence
      - active
      - created_at
      - updated_at
      title: BlocklistEntryResponse
      type: object
    DNSConfigRecord:
      description: DNS config record DTO.
      properties:
        name:
          title: Name
          type: string
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
        priority:
          anyOf:
          - type: integer
          - type: 'null'
          title: Priority
        ttl:
          title: Ttl
          type: integer
        type:
          title: Type
          type: string
        value:
          title: Value
          type: string
        weight:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weight
      required:
      - name
      - type
      - value
      - ttl
      title: DNSConfigRecord
      type: object
    DNSConfigZone:
      description: DNS config zone DTO.
      properties:
        name:
          title: Name
          type: string
        records:
          items:
            $ref: '#/components/schemas/DNSConfigRecord'
          title: Records
          type: array
        visibility:
          title: Visibility
          type: string
      required:
      - name
      - visibility
      - records
      title: DNSConfigZone
      type: object
    DNSServerConfigResponse:
      description: Server configuration response.
      properties:
        cache_settings:
          additionalProperties: true
          title: Cache Settings
          type: object
        settings:
          additionalProperties: true
          title: Settings
          type: object
        version:
          title: Version
          type: integer
        zones:
          items:
            $ref: '#/components/schemas/DNSConfigZone'
          title: Zones
          type: array
      required:
      - zones
      - cache_settings
      - settings
      - version
      title: DNSServerConfigResponse
      type: object
    DNSServerMetricsResponse:
      description: DNS server metrics response.
      properties:
        avg_response_ms:
          title: Avg Response Ms
          type: number
        cache_hits:
          title: Cache Hits
          type: integer
        errors:
          title: Errors
          type: integer
        queries_total:
          title: Queries Total
          type: integer
        server_id:
          title: Server Id
          type: string
        timestamp:
          title: Timestamp
          type: string
      required:
      - server_id
      - timestamp
      - queries_total
      - cache_hits
      - errors
      - avg_response_ms
      title: DNSServerMetricsResponse
      type: object
    DNSServerResponse:
      description: DNS server response DTO.
      properties:
        created_at:
          title: Created At
          type: string
        hostname:
          anyOf:
          - type: string
          - type: 'null'
          title: Hostname
        id:
          title: Id
          type: string
        last_heartbeat:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Heartbeat
        name:
          title: Name
          type: string
        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
        status:
          title: Status
          type: string
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      required:
      - id
      - name
      - status
      - version
      - region
      - hostname
      - last_heartbeat
      - created_at
      title: DNSServerResponse
      type: object
    FeedSourceResponse:
      description: Feed source response DTO.
      properties:
        created_at:
          title: Created At
          type: string
        enabled:
          title: Enabled
          type: boolean
        id:
          title: Id
          type: string
        last_refresh_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Refresh At
        last_refresh_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Refresh Error
        last_refresh_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Refresh Status
        name:
          title: Name
          type: string
        source_type:
          title: Source Type
          type: string
        url:
          title: Url
          type: string
      required:
      - id
      - name
      - source_type
      - url
      - enabled
      - last_refresh_at
      - last_refresh_status
      - last_refresh_error
      - created_at
      title: FeedSourceResponse
      type: object
    PerformanceMetric:
      description: Performance metric DTO.
      properties:
        metric:
          title: Metric
          type: string
        value:
          title: Value
          type: number
      required:
      - metric
      - value
      title: PerformanceMetric
      type: object
    QueryTimelineEntry:
      description: Query timeline entry DTO.
      properties:
        queries:
          title: Queries
          type: integer
        timestamp:
          title: Timestamp
          type: string
      required:
      - timestamp
      - queries
      title: QueryTimelineEntry
      type: object
    RecordResponse:
      description: Record response DTO.
      properties:
        created_at:
          title: Created At
          type: string
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Port
        priority:
          anyOf:
          - type: integer
          - type: 'null'
          title: Priority
        ttl:
          title: Ttl
          type: integer
        type:
          title: Type
          type: string
        value:
          title: Value
          type: string
        weight:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weight
      required:
      - id
      - name
      - type
      - value
      - ttl
      - created_at
      title: RecordResponse
      type: object
    ServerSummaryEntry:
      description: Server summary entry DTO.
      properties:
        avg_response_ms:
          title: Avg Response Ms
          type: number
        cache_hits:
          title: Cache Hits
          type: integer
        errors:
          title: Errors
          type: integer
        queries:
          title: Queries
          type: integer
        server_id:
          title: Server Id
          type: string
        server_name:
          title: Server Name
          type: string
      required:
      - server_id
      - server_name
      - queries
      - cache_hits
      - errors
      - avg_response_ms
      title: ServerSummaryEntry
      type: object
    SummaryMetric:
      description: Summary metric DTO.
      properties:
        key:
          title: Key
          type: string
        value:
          title: Value
          type: integer
      required:
      - key
      - value
      title: SummaryMetric
      type: object
    ZoneResponse:
      description: Zone response DTO.
      properties:
        created_at:
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: string
        name:
          title: Name
          type: string
        visibility:
          title: Visibility
          type: string
      required:
      - id
      - name
      - visibility
      - description
      - created_at
      title: ZoneResponse
      type: object
  securitySchemes:
    BearerAuth:
      scheme: bearer
      type: http
      bearerFormat: JWT
info:
  title: hub_api.app
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/auth/login:
    post:
      description: '

        Request body: {email, password, mfa_token?}

        Returns:

        - 200 {access_token, refresh_token, expires_in: 3600, token_type: "Bearer"}

        - 200 {mfa_required: true} (no tokens) when MFA needed

        - 401 {error: "Invalid credentials"} on failure

        - 400 on missing fields'
      operationId: post_login
      parameters: []
      responses: {}
      summary: Authenticate user by email and password.
  /api/v1/auth/logout:
    post:
      description: '

        Request body: {refresh_token}

        Returns:

        - 204 No Content on success

        - 400 on missing fields'
      operationId: post_logout
      parameters: []
      responses: {}
      summary: Logout user by revoking refresh token.
  /api/v1/auth/public-key:
    get:
      description: "\nUsed by headend servers and clients to verify JWTs issued by\
        \ the auth service.\nReturns the key in PEM format with the key ID (kid).\n\
        \nThis endpoint is PUBLIC (no authentication required) because headends need\n\
        the key before they can authenticate.\n\nReturns:\n    - 200: {public_key:\
        \ \"...\", kid: \"...\", algorithm: \"RS256\", ...}\n    - 500: {error: \"\
        ...\"} on server error"
      operationId: get_get_auth_public_key
      parameters: []
      responses: {}
      summary: Get the public key for JWT verification.
  /api/v1/auth/refresh:
    post:
      description: "\nThis is the FLAT equivalent of `/api/v1/sase/jwt/refresh`.\n\
        Does NOT require a pre-existing JWT (uses refresh_token for auth).\n\nRequest\
        \ body:\n{\n    \"refresh_token\": \"eyJhbGc...\"\n}\n\nReturns:\n    - 200:\
        \ {access_token, refresh_token, expires_in, token_type, meta}\n    - 400:\
        \ {error: \"...\"} if validation fails\n    - 401: {error: \"...\"} if token\
        \ is invalid/expired/replayed\n    - 503: {error: \"...\", retry_with_credentials:\
        \ true} if cache unavailable\n    - 500: {error: \"...\"} on server error"
      operationId: post_refresh_auth_token
      parameters: []
      responses: {}
      summary: Refresh JWT access token using refresh token with rotation.
  /api/v1/auth/token:
    post:
      description: "\nThis is the FLAT equivalent of `/api/v1/sase/jwt/token`.\nUsed\
        \ by Go hub-router to obtain initial JWT after registration.\n\nRequires node_id,\
        \ node_type, and api_key in request body.\nDoes NOT require a pre-existing\
        \ JWT (caller has none yet).\n\nRequest body:\n{\n    \"node_id\": \"cluster-1\"\
        ,\n    \"node_type\": \"kubernetes_node\" | \"raw_compute\" | \"client_docker\"\
        \ | \"client_native\",\n    \"api_key\": \"secret-api-key\"\n}\n\nReturns:\n\
        \    - 200: {access_token, refresh_token, expires_in, token_type, meta}\n\
        \    - 400: {error: \"...\"} if validation fails\n    - 401: {error: \"...\"\
        } if authentication fails\n    - 500: {error: \"...\"} on server error"
      operationId: post_issue_auth_token
      parameters: []
      responses: {}
      summary: Issue JWT token for an authenticated cluster/client node.
  /api/v1/auth/validate:
    post:
      description: "\nUsed by headend servers to validate node JWTs issued by the\
        \ auth service.\nRequires the JWT in the Authorization header (the token to\
        \ validate).\n\nRequest header:\n    Authorization: Bearer <token>\n\nReturns:\n\
        \    - 200: {valid: True, node_id: \"...\", tenant: \"...\", ...}\n    - 401:\
        \ {error: \"...\"} if token is invalid\n    - 500: {error: \"...\"} on server\
        \ error"
      operationId: post_validate_auth_token
      parameters: []
      responses: {}
      summary: Validate a JWT token and return its payload.
  /api/v1/certs/certificates:
    post:
      description: "\nRequires machine-JWT with certs:issue scope (or legacy enrollment\
        \ token if flag OFF).\nUsed during node onboarding and cert renewal.\n\nRequest\
        \ body:\n{\n    \"type\": \"client\" | \"headend\",\n    \"id\": \"node-id\"\
        ,\n    \"name\": \"node-name\",\n    \"client_type\": \"docker\" | \"native\"\
        \ (for client type),\n    \"san_names\": [\"dns1\", \"dns2\"] (for headend\
        \ type)\n}\n\nReturns:\n    JSON response with certificate type and PEM-encoded\
        \ cert/key/CA."
      operationId: post_generate_certificate
      parameters: []
      responses: {}
      summary: Generate a signed X.509 certificate for a node.
  /api/v1/clusters/:
    get:
      description: "\nThis is the FLAT equivalent of `/api/v1/sase/clusters/` (GET).\n\
        Used by Go hub-router to enumerate clusters for policy sync.\n\nRequires valid\
        \ JWT with clusters:read scope.\n\nReturns:\n    - 200: {clusters: [...],\
        \ meta: {...}}\n    - 403: {error: \"...\"} if auth fails\n    - 500: {error:\
        \ \"...\"} on server error"
      operationId: get_list_clusters_flat
      parameters: []
      responses: {}
      summary: List all clusters for the tenant.
  /api/v1/firewall/rules:
    get:
      description: "\nRequires machine-JWT authentication (or legacy static token\
        \ if flag OFF).\nReturns rules for all active users in the authenticated tenant.\n\
        \nReturns:\n    - 200: {timestamp, rules_count, user_rules: {user_id: [rules]}}\n\
        \    - 401: {error: \"...\"} if auth fails\n    - 500: {error: \"...\"} on\
        \ server error"
      operationId: get_get_firewall_rules
      parameters: []
      responses: {}
      summary: Get all firewall rules for headend consumption.
  /api/v1/headend/{headend_id}/ports:
    get:
      description: "\nRequires machine-JWT authentication (or legacy static token\
        \ if flag OFF).\nOptional query param: cluster_id (defaults to \"cluster-{headend_id}\"\
        ).\n\nArgs:\n    headend_id: ID of the headend.\n\nReturns:\n    - 200: {headend_id,\
        \ cluster_id, tcp_ranges, udp_ranges, ...}\n    - 401: {error: \"...\"} if\
        \ auth fails\n    - 404: {error: \"...\"} if no config found\n    - 500: {error:\
        \ \"...\"} on server error"
      operationId: get_get_headend_ports
      parameters:
      - in: path
        name: headend_id
        required: true
        schema:
          type: string
      responses: {}
      summary: Get port configuration for a specific headend.
  /api/v1/jwt/public-key:
    get:
      description: "\nUsed by headend servers and clients to verify JWTs issued by\
        \ the\nauth service. Returns the key in PEM format with the key ID (kid).\n\
        \nReturns:\n    JSON response with public_key, kid, algorithm, and use."
      operationId: get_get_jwt_public_key
      parameters: []
      responses: {}
      summary: Get the public key for JWT verification.
  /api/v1/jwt/refresh:
    post:
      description: "\nRequest body:\n{\n    \"refresh_token\": \"eyJhbGc...\"\n}\n\
        \nReturns:\n    JSON response with new access_token and expires_in."
      operationId: post_refresh_jwt_token
      parameters: []
      responses: {}
      summary: Refresh JWT access token using refresh token.
  /api/v1/jwt/revoke:
    post:
      description: "\nRequires tenant claim and jwt:revoke scope.\nOnly node_id-based\
        \ revocation is supported; revocation of tokens\nfrom other tenants is rejected\
        \ with 403.\n\nRequest body:\n{\n    \"node_id\": \"cluster-1\"  (revoke all\
        \ tokens for node)\n}\n\nReturns:\n    JSON response with revocation result."
      operationId: post_revoke_jwt_token
      parameters: []
      responses: {}
      summary: Revoke JWT token(s) for a node in the caller's tenant.
  /api/v1/jwt/token:
    post:
      description: "\nRequires node_id, node_type, and api_key. Authenticates via\n\
        cluster_manager (for headend nodes) or client_registry (for clients).\n\n\
        Request body:\n{\n    \"node_id\": \"cluster-1\",\n    \"node_type\": \"kubernetes_node\"\
        \ | \"raw_compute\" | \"client_docker\" | \"client_native\",\n    \"api_key\"\
        : \"secret-api-key\"\n}\n\nReturns:\n    JSON response with access_token,\
        \ refresh_token, expires_in."
      operationId: post_generate_jwt_token
      parameters: []
      responses: {}
      summary: Generate JWT token for an authenticated node.
  /api/v1/jwt/validate:
    post:
      description: "\nUsed by headend servers to validate node JWTs.\n\nRequest header:\n\
        \    Authorization: Bearer <token>\n\nReturns:\n    JSON response with validation\
        \ result and claims."
      operationId: post_validate_jwt_token
      parameters: []
      responses: {}
      summary: Validate a JWT token and return its payload.
  /api/v1/netsvcs/analytics/performance:
    get:
      description: "\nQuery parameters:\n    hours: Number of hours to look back (default\
        \ 24)\n\nReturns:\n    JSON response with performance metrics (avg, min, max,\
        \ percentiles)."
      operationId: get_get_performance_analytics
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Performance analytics response.
                properties:
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  metrics:
                    items:
                      $ref: '#/components/schemas/PerformanceMetric'
                    title: Metrics
                    type: array
                required:
                - metrics
                - meta
                title: PerformanceAnalyticsResponse
                type: object
          description: Performance analytics response.
      summary: Get performance analytics for this tenant.
      tags:
      - netsvcs
  /api/v1/netsvcs/analytics/queries:
    get:
      description: "\nQuery parameters:\n    hours: Number of hours to look back (default\
        \ 24)\n\nReturns:\n    JSON response with query totals and timeline."
      operationId: get_get_queries_analytics
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Queries analytics response.
                properties:
                  cache_hit_rate:
                    title: Cache Hit Rate
                    type: number
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  timeline:
                    items:
                      $ref: '#/components/schemas/QueryTimelineEntry'
                    title: Timeline
                    type: array
                  total_cache_hits:
                    title: Total Cache Hits
                    type: integer
                  total_errors:
                    title: Total Errors
                    type: integer
                  total_queries:
                    title: Total Queries
                    type: integer
                required:
                - total_queries
                - total_cache_hits
                - total_errors
                - cache_hit_rate
                - timeline
                - meta
                title: QueriesAnalyticsResponse
                type: object
          description: Queries analytics response.
      summary: Get query analytics for this tenant.
      tags:
      - netsvcs
  /api/v1/netsvcs/analytics/servers:
    get:
      description: "\nQuery parameters:\n    hours: Number of hours to look back (default\
        \ 24)\n\nReturns:\n    JSON response with per-server metrics."
      operationId: get_get_servers_analytics
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Servers analytics response.
                properties:
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  servers:
                    items:
                      $ref: '#/components/schemas/ServerSummaryEntry'
                    title: Servers
                    type: array
                required:
                - servers
                - meta
                title: ServersAnalyticsResponse
                type: object
          description: Servers analytics response.
      summary: Get per-server analytics for this tenant.
      tags:
      - netsvcs
  /api/v1/netsvcs/analytics/summary:
    get:
      description: "\nReturns:\n    JSON response with zone/record/server/query counts\
        \ for THIS TENANT ONLY."
      operationId: get_get_summary_analytics
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Summary analytics response.
                properties:
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  metrics:
                    items:
                      $ref: '#/components/schemas/SummaryMetric'
                    title: Metrics
                    type: array
                required:
                - metrics
                - meta
                title: SummaryAnalyticsResponse
                type: object
          description: Summary analytics response.
      summary: Get dashboard summary for this tenant.
      tags:
      - netsvcs
  /api/v1/netsvcs/dns-servers:
    get:
      description: "\nReturns:\n    JSON response with list of servers and meta."
      operationId: get_list_dns_servers
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: List of DNS servers response.
                properties:
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                  servers:
                    items:
                      $ref: '#/components/schemas/DNSServerResponse'
                    title: Servers
                    type: array
                required:
                - servers
                - meta
                title: DNSServersListResponse
                type: object
          description: List of DNS servers response.
      summary: List all DNS servers for the tenant.
      tags:
      - netsvcs
  /api/v1/netsvcs/dns-servers/register:
    post:
      description: "\nRequires ENROLLMENT_BOOTSTRAP_TOKEN for enrollment.\nReturns\
        \ machine-JWT + refresh token for subsequent API calls.\n\nReturns:\n    JSON\
        \ response with server_id, jwt, refresh_token, and config."
      operationId: post_register_server
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Server enrollment response (machine-JWT + config).
                properties:
                  config:
                    $ref: '#/components/schemas/DNSServerConfigResponse'
                  jwt:
                    title: Jwt
                    type: string
                  refresh_token:
                    title: Refresh Token
                    type: string
                  server_id:
                    title: Server Id
                    type: string
                required:
                - server_id
                - jwt
                - refresh_token
                - config
                title: DNSEnrollmentResponse
                type: object
          description: Server enrollment response (machine-JWT + config).
      summary: Register a new DNS resolver server with bootstrap token.
      tags:
      - netsvcs
  /api/v1/netsvcs/dns-servers/{server_id}:
    delete:
      description: "\nArgs:\n    server_id: Server ID to delete\n\nReturns:\n    JSON\
        \ response with deletion status."
      operationId: delete_delete_dns_server
      parameters:
      - in: path
        name: server_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Generic message response DTO.
                properties:
                  message:
                    title: Message
                    type: string
                  meta:
                    additionalProperties: true
                    title: Meta
                    type: object
                required:
                - message
                - meta
                title: MessageResponse
                type: object
          description: Generic message response DTO.
      summary: Delete a DNS server and its metrics.
      tags:
      - netsvcs
    get:
      description: "\nArgs:\n    server_id: Server ID to retrieve\n\nReturns:\n  \
        \  JSON response with server details."
      operationId: get_get_dns_server
      parameters:
      - in: path
        name: server_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: DNS server response DTO.
                properties:
                  created_at:
                    title: Created At
                    type: string
                  hostname:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Hostname
                  id:
                    title: Id
                    type: string
                  last_heartbeat:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Heartbeat
                  name:
                    title: Name
                    type: string
                  region:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Region
                  status:
                    title: Status
                    type: string
                  version:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Version
                required:
                - id
                - name
                - status
                - version
                - region
                - hostname
                - last_heartbeat
                - created_at
                title: DNSServerResponse
                type: object
          description: DNS server response DTO.
      summary: Get details of a specific DNS server.
      tags:
      - netsvcs
  /api/v1/netsvcs/dns-servers/{server_id}/config:
    get:
      description: "\nRequires machine-JWT with dns:config:read scope.\nVerifies the\
        \ machine subject matches the server ID.\n\nArgs:\n    server_id: Server ID\n\
        \nReturns:\n    JSON response with zones, records, and config version."
      operationId: get_get_server_config
      parameters:
      - in: path
        name: server_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Server configuration response.
                properties:
                  cache_settings:
                    additionalProperties: true
                    title: Cache Settings
                    type: object
                  settings:
                    additionalProperties: true
                    title: Settings
