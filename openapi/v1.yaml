      parameters: []
      responses: {}
      summary: Return ziti module scaffold status.
  /docs/public:
    get:
      description: '

        Accessible without authentication. Exposes only the login/token endpoints

        to allow unauthenticated clients to discover how to authenticate.'
      operationId: get_public_docs
      parameters: []
      responses: {}
      summary: Public OpenAPI documentation with login endpoint only.
  /health:
    get:
      description: "\nDoes not check external dependencies; only verifies the process\
        \ is up.\n\nReturns:\n    JSON response with health status and status code.\n\
        \    200 always (process-only check)."
      operationId: get_health_check
      parameters: []
      responses: {}
      summary: Liveness probe endpoint. Returns 200 if process is running.
  /openapi.json:
    get:
      description: '

        Returns 401 if the request does not include a valid JWT token.

        Exposes the complete API surface, schemas, and security requirements.'
      operationId: get_full_openapi_spec
      parameters: []
      responses: {}
      summary: Full OpenAPI specification for authenticated users only.
  /ready:
    get:
      description: "\nReturns 200 if process is up and database is reachable, 503\
        \ if DB check fails.\n\nReturns:\n    JSON response with readiness status\
        \ and status code.\n    200 if ready, 503 if database check fails."
      operationId: get_readiness_check
      parameters: []
      responses: {}
      summary: Readiness probe endpoint with database connectivity check.
  /static/{filename}:
    get:
      operationId: get_send_static_file
      parameters:
      - in: path
        name: filename
        required: true
        schema:
          type: string
      responses: {}
