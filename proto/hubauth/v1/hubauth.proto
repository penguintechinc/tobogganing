syntax = "proto3";

package hubauth.v1;

option go_package = "github.com/penguintechinc/tobogganing/proto/hubauth/v1;hubauthv1";

// HubAuthKeyService exposes hub-api's JWT verification key material over
// gRPC (intra-cluster) as a replacement/complement for the REST
// GET /api/v1/auth/public-key poll. The response is JWKS-shaped (a *set*
// of keys, not a single key) from day one so a future signing-algorithm
// rekey (ES256 primary + RS256 legacy verify-only, bake-out window) can be
// represented without a second transport/schema migration — see
// docs/design: hub-api SSO relocation, §6.
service HubAuthKeyService {
  // GetPublicKeys returns the current set of JWT verification public keys.
  // At most one key is marked `primary` (the currently-active signing key);
  // any remaining keys are legacy, verify-only material during a bake-out
  // window. Today this returns exactly one RS256 key with primary=true —
  // a pure schema/transport addition, no algorithm change.
  rpc GetPublicKeys(GetPublicKeysRequest) returns (PublicKeySetResponse);
}

message GetPublicKeysRequest {
  // api_version routes this request to the correct handler generation
  // (backend.md API Versioning: required runtime field, independent of the
  // proto package's compile-time v1 isolation). Only "v1" is supported today.
  string api_version = 1;
}

message PublicKeySetResponse {
  repeated PublicKey keys = 1;
}

message PublicKey {
  // kid is the Key ID (sha256(public_key_pem)[:16]) used to select the
  // correct key by a token's JWT header `kid` claim.
  string kid = 1;
  // algorithm is the JWS alg this key signs/verifies, e.g. "RS256" (today),
  // "ES256" (future primary, post-rekey).
  string algorithm = 2;
  // public_key_pem is the SubjectPublicKeyInfo PEM-encoded public key.
  string public_key_pem = 3;
  // use is the JWK "use" parameter; always "sig" for this service.
  string use = 4;
  // primary is true only for the currently-active signing key. At most one
  // key in a PublicKeySetResponse has primary=true; all others are
  // legacy/verify-only.
  bool primary = 5;
  // fetched_at_unix is the Unix timestamp (seconds) at which the server
  // read this key from its KeyProvider, for client-side cache/staleness
  // bookkeeping.
  int64 fetched_at_unix = 6;
}
