# SPIRE Helm Chart Values
# Default configuration for SPIRE server and agents
# Deploy only on on-prem, bare-metal, or non-managed Kubernetes clusters

spire:
  # Must be explicitly enabled
  enabled: false
  trustDomain: "default.tobogganing.io"
  # Namespace where SPIRE will be deployed
  namespace: spire-system

server:
  # Number of SPIRE server replicas
  replicas: 1

  image:
    repository: ghcr.io/spiffe/spire-server
    tag: "1.10.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health check configuration
  healthProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # Data store configuration
  dataStore:
    type: sqlite3
    connectionString: "/run/spire/data/datastore.sqlite3"
    # For PostgreSQL: "postgresql://user:pass@host:5432/spire"
    # For MySQL: "mysql+pymysql://user:pass@host:3306/spire"

  # PVC for persistent data storage
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: null  # Use default StorageClass
    accessModes:
      - ReadWriteOnce

  # Node attestors enabled on this SPIRE server
  nodeAttestors:
    - k8s_psat
    # Uncomment for specific environments:
    # - aws_iid      # AWS Instance Identity Document
    # - gcp_iit      # GCP Instance Identity Token
    # - azure_msi    # Azure Managed Service Identity
    # - tpm_devid    # TPM 2.0 DevID (bare metal)
    # - x509pop      # X.509 Proof of Possession (VMs)

  # Port configuration
  port: 8081
  bindAddress: "0.0.0.0"

agent:
  # SPIRE agent image
  image:
    repository: ghcr.io/spiffe/spire-agent
    tag: "1.10.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Health check configuration
  healthProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  # Workload attestors enabled on agents
  workloadAttestors:
    - k8s
    - unix

  # Port configuration
  port: 8082
  bindAddress: "127.0.0.1"

# Federation configuration for cross-cluster trust
federation:
  enabled: false
  bundleEndpoints: []
  # Example:
  # bundleEndpoints:
  #   - address: "https://other-cluster.example.com:8443"
  #     trustDomain: "other.tobogganing.io"

# RBAC configuration
rbac:
  # Create RBAC resources (ServiceAccount, ClusterRole, ClusterRoleBinding)
  create: true

# Pod security settings
podSecurityPolicy:
  enabled: false

# Service account configuration
serviceAccount:
  create: true
  name: null  # Autogenerated if null

# Node selector for SPIRE agent pods
nodeSelector: {}

# Tolerations for SPIRE agent pods (usually all nodes)
tolerations:
  - operator: Exists

# Affinity rules (typically none for daemonset agents)
affinity: {}

# Logging configuration
logging:
  level: info  # debug, info, warning, error
  format: json  # json or text

# Debug mode
debug: false
