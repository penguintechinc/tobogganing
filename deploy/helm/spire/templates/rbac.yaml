{{- if and .Values.spire.enabled .Values.rbac.create }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tobogganing-spire.namespace" . }}
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tobogganing-spire.serviceAccountName" . }}
  namespace: {{ include "tobogganing-spire.namespace" . }}
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-agent
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: agent
rules:
# For k8s_psat node attestor
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
# For unix and k8s workload attestors
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-server
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: server
rules:
# For notifier bundle endpoint
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - spire-bundle
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
# For health checks and diagnostics
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-agent
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tobogganing-spire.fullname" . }}-agent
subjects:
- kind: ServiceAccount
  name: {{ include "tobogganing-spire.serviceAccountName" . }}
  namespace: {{ include "tobogganing-spire.namespace" . }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-server
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tobogganing-spire.fullname" . }}-server
subjects:
- kind: ServiceAccount
  name: {{ include "tobogganing-spire.serviceAccountName" . }}
  namespace: {{ include "tobogganing-spire.namespace" . }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-agent-webhook
  namespace: {{ include "tobogganing-spire.namespace" . }}
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: agent
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tobogganing-spire.fullname" . }}-agent-webhook
  namespace: {{ include "tobogganing-spire.namespace" . }}
  labels:
    {{- include "tobogganing-spire.labels" . | nindent 4 }}
    component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tobogganing-spire.fullname" . }}-agent-webhook
subjects:
- kind: ServiceAccount
  name: {{ include "tobogganing-spire.serviceAccountName" . }}
  namespace: {{ include "tobogganing-spire.namespace" . }}
{{- end }}
