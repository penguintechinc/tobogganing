# SPIRE Values for Federated Multi-Cluster Setup
# Use with: helm install spire ./deploy/helm/spire -f values-federated.yaml

spire:
  enabled: true
  trustDomain: "primary.tobogganing.io"
  namespace: spire-system

server:
  replicas: 1

  image:
    repository: ghcr.io/spiffe/spire-server
    tag: "1.10.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  healthProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # PostgreSQL for multi-cluster federation
  dataStore:
    type: postgresql
    connectionString: "postgresql://spire:password@spire-postgres.spire-system.svc.cluster.local:5432/spire"

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "standard"
    accessModes:
      - ReadWriteOnce

  # Support multiple clusters via PSAT
  nodeAttestors:
    - k8s_psat

  port: 8081
  bindAddress: "0.0.0.0"

agent:
  image:
    repository: ghcr.io/spiffe/spire-agent
    tag: "1.10.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  healthProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  workloadAttestors:
    - k8s
    - unix

  port: 8082
  bindAddress: "127.0.0.1"

# Federation: Trust with other clusters
federation:
  enabled: true
  bundleEndpoints:
    - address: "https://secondary.example.com:8443"
      trustDomain: "secondary.tobogganing.io"
    - address: "https://tertiary.example.com:8443"
      trustDomain: "tertiary.tobogganing.io"

rbac:
  create: true

podSecurityPolicy:
  enabled: false

serviceAccount:
  create: true
  name: null

nodeSelector: {}

tolerations:
  - operator: Exists

affinity: {}

logging:
  level: info
  format: json

debug: false
