apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobogganing-hub-api
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    
    # CORS if needed
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "https://your-domain.com"
    
    # Certificate management (if using cert-manager)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Use appropriate ingress class
  tls:
  - hosts:
    - hub-api.tobogganing.example.com
    secretName: tobogganing-tls
  rules:
  - host: hub-api.tobogganing.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hub-api
            port:
              number: 8080
---
# Optional: Ingress for hub-router proxy (if exposing HTTP proxy)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobogganing-hub-router
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - headend.tobogganing.example.com
    secretName: tobogganing-headend-tls
  rules:
  - host: headend.tobogganing.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headend-internal
            port:
              number: 8080