apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-api
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tobogganing
      app.kubernetes.io/component: hub-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tobogganing
        app.kubernetes.io/component: hub-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      serviceAccountName: tobogganing
      containers:
      - name: hub-api
        image: ghcr.io/your-org/tobogganing/hub-api:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tobogganing-secrets
              key: redis-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tobogganing-secrets
              key: jwt-secret
        - name: LOG_LEVEL
          value: "info"
        - name: ADMIN_EMAIL
          valueFrom:
            configMapKeyRef:
              name: tobogganing-config
              key: admin-email
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tobogganing-secrets
              key: admin-password
        - name: DB_PATH
          value: "/app/data/tobogganing.db"
        - name: CERT_DIR
          value: "/app/certs"
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: hub-api-data
          mountPath: /app/data
        - name: hub-api-certs
          mountPath: /app/certs
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: hub-api-data
        persistentVolumeClaim:
          claimName: hub-api-data-pvc
      - name: hub-api-certs
        persistentVolumeClaim:
          claimName: hub-api-certs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hub-api
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-api
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-api-data-pvc
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-api
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hub-api-certs-pvc
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-api
spec:
  accessModes:
  - ReadWriteMany  # Shared across manager replicas
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""