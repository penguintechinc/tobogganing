apiVersion: v1
kind: ServiceMonitor
metadata:
  name: tobogganing-hub-api
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tobogganing
      app.kubernetes.io/component: hub-api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: tobogganing-hub-router
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tobogganing
      app.kubernetes.io/component: hub-router
  endpoints:
  - port: proxy
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tobogganing-dashboard
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: dashboard
    grafana_dashboard: "1"
data:
  tobogganing.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Tobogganing Overview",
        "description": "Monitoring dashboard for Tobogganing SASE solution",
        "tags": ["tobogganing", "sase", "vpn"],
        "style": "dark",
        "timezone": "",
        "refresh": "30s",
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "panels": [
          {
            "title": "Manager API Requests",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{service=\"manager\"}[5m])",
                "legendFormat": "{{method}} {{code}}"
              }
            ]
          },
          {
            "title": "Active WireGuard Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "wireguard_active_connections",
                "legendFormat": "Connections"
              }
            ]
          },
          {
            "title": "Headend Proxy Traffic",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(proxy_bytes_total[5m])",
                "legendFormat": "{{direction}}"
              }
            ]
          },
          {
            "title": "Certificate Validity",
            "type": "graph",
            "targets": [
              {
                "expr": "certificate_expiry_days",
                "legendFormat": "{{type}}"
              }
            ]
          }
        ]
      }
    }