# Tobogganing Development Docker Compose Configuration
version: '3.8'

services:
  # Redis for development
  redis:
    image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    container_name: tobogganing-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass devpassword --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - tobogganing-dev

  # Manager Service - Development
  hub-api:
    image: ghcr.io/your-org/tobogganing/hub-api:dev
    container_name: tobogganing-dev-hub-api
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://:devpassword@redis:6379
      - JWT_SECRET=dev-jwt-secret-not-for-production
      - LOG_LEVEL=debug
      - ADMIN_EMAIL=dev@example.com
      - ADMIN_PASSWORD=devpassword
      - DB_PATH=/app/data/tobogganing.db
      - CERT_DIR=/app/certs
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - DEBUG=true
    volumes:
      - hub_api_dev_data:/app/data
      - hub_api_dev_certs:/app/certs
      # Mount source code for development (if building locally)
      # - ../../services/hub-api:/app:ro
    networks:
      - tobogganing-dev

  # Headend Server - Development
  hub-router:
    image: ghcr.io/your-org/tobogganing/hub-router:dev
    container_name: tobogganing-dev-hub-router
    restart: unless-stopped
    depends_on:
      - hub-api
    ports:
      - "51820:51820/udp"
      - "8081:8080"
    environment:
      - MANAGER_API_URL=http://hub-api:8080
      - LOG_LEVEL=debug
      - CLUSTER_ID=dev-cluster
      - NODE_ID=hub-router-dev-01
      - TRAFFIC_MIRROR_ENABLED=false
    volumes:
      - hub_router_dev_data:/app/data
      - hub_router_dev_wireguard:/etc/wireguard
      # Mount source code for development (if building locally)
      # - ../../services/hub-router:/app:ro
    networks:
      - tobogganing-dev
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true

  # Client container for testing
  client:
    image: ghcr.io/your-org/tobogganing/client:dev
    container_name: tobogganing-dev-client
    restart: "no"  # Manual start for testing
    environment:
      - MANAGER_URL=http://hub-api:8080
      - API_KEY=dev-api-key-12345
      - CLIENT_NAME=dev-client-01
      - LOG_LEVEL=debug
      - AUTO_CONNECT=false
    volumes:
      - client_dev_data:/app/data
    networks:
      - tobogganing-dev
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    depends_on:
      - hub-api
      - hub-router
    profiles:
      - testing

  # Development tools
  adminer:
    image: adminer:latest@sha256:16a72c6140f64d00a3a9edf8d3d3b18a7b0a29ca31b0453378d9eb71f01f9e34
    container_name: tobogganing-dev-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - tobogganing-dev
    profiles:
      - tools

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    container_name: tobogganing-dev-redis-commander
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:devpassword
    networks:
      - tobogganing-dev
    profiles:
      - tools

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: tobogganing-dev-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - tobogganing-dev
    profiles:
      - tools

volumes:
  redis_dev_data:
  hub_api_dev_data:
  hub_api_dev_certs:
  hub_router_dev_data:
  hub_router_dev_wireguard:
  client_dev_data:

networks:
  tobogganing-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16