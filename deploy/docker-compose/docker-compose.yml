# Tobogganing Production Docker Compose Configuration
version: '3.8'

services:
  # Redis for session management and caching
  redis:
    image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    container_name: tobogganing-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - tobogganing-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Manager Service - Central orchestration
  hub-api:
    image: ghcr.io/your-org/tobogganing/hub-api:${VERSION:-latest}
    container_name: tobogganing-hub-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${MANAGER_PORT:-8080}:8080"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_PATH=/app/data/tobogganing.db
      - CERT_DIR=/app/certs
      - PYTHONUNBUFFERED=1
    volumes:
      - hub_api_data:/app/data
      - hub_api_certs:/app/certs
      - ./config/hub-api:/app/config:ro
    networks:
      - tobogganing-internal
      - tobogganing-external
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Headend Server - WireGuard termination and proxy
  hub-router:
    image: ghcr.io/your-org/tobogganing/hub-router:${VERSION:-latest}
    container_name: tobogganing-hub-router
    restart: unless-stopped
    depends_on:
      hub-api:
        condition: service_healthy
    ports:
      - "${WIREGUARD_PORT:-51820}:51820/udp"
      - "${HEADEND_PROXY_PORT:-8080}:8080"
    environment:
      - MANAGER_API_URL=http://hub-api:8080
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CLUSTER_ID=${CLUSTER_ID:-default}
      - NODE_ID=hub-router-01
      # Traffic mirroring configuration
      - TRAFFIC_MIRROR_ENABLED=${TRAFFIC_MIRROR_ENABLED:-false}
      - TRAFFIC_MIRROR_DESTINATIONS=${TRAFFIC_MIRROR_DESTINATIONS:-}
      - TRAFFIC_MIRROR_PROTOCOL=${TRAFFIC_MIRROR_PROTOCOL:-VXLAN}
      - TRAFFIC_MIRROR_SAMPLE_RATE=${TRAFFIC_MIRROR_SAMPLE_RATE:-100}
    volumes:
      - hub_router_data:/app/data
      - hub_router_wireguard:/etc/wireguard
      - ./config/hub-router:/app/config:ro
    networks:
      - tobogganing-internal
      - tobogganing-external
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true  # Required for WireGuard interface management
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    container_name: tobogganing-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - tobogganing-internal
    profiles:
      - monitoring
    depends_on:
      - hub-api
      - hub-router

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:12.4.2@sha256:83749231c3835e390a3144e5e940203e42b9589761f20ef3169c716e734ad505
    container_name: tobogganing-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - tobogganing-internal
    profiles:
      - monitoring
    depends_on:
      - prometheus

  # NGINX reverse proxy (optional)
  nginx:
    image: nginx:stable-bookworm@sha256:552e7481ca93ffccd046aa658dbbed22caefbc09c66fa7cd247cbb90b8a5c609
    container_name: tobogganing-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - tobogganing-external
    profiles:
      - proxy
    depends_on:
      - hub-api
      - hub-router

# Volumes for persistent data
volumes:
  redis_data:
    driver: local
  hub_api_data:
    driver: local
  hub_api_certs:
    driver: local
  hub_router_data:
    driver: local
  hub_router_wireguard:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

# Networks
networks:
  tobogganing-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
  tobogganing-external:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16