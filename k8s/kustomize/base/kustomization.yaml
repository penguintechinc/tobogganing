apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tobogganing

commonLabels:
  app.kubernetes.io/part-of: tobogganing

resources:
  - namespace.yaml
  - hub-api.yaml
  - hub-router.yaml
  - hub-webui.yaml
  - redis.yaml
  - monitoring.yaml

configMapGenerator:
  - name: tobogganing-config
    literals:
      - LOG_LEVEL=info
      - HUB_API_URL=http://hub-api:8080
      - HUB_ROUTER_METRICS_URL=http://hub-router:9090
      - REDIS_URL=redis://redis:6379
      - DB_TYPE=sqlite

secretGenerator:
  - name: tobogganing-secrets
    type: Opaque
    literals:
      - JWT_SECRET=change-me-in-production
      - DB_PASSWORD=change-me-in-production
      - REDIS_PASSWORD=
      - WG_PRIVATE_KEY=
      - LICENSE_KEY=
