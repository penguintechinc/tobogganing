apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-webui
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-webui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tobogganing
      app.kubernetes.io/component: hub-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tobogganing
        app.kubernetes.io/component: hub-webui
    spec:
      serviceAccountName: tobogganing
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: hub-webui
          image: tobogganing/hub-webui:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: HUB_API_URL
              valueFrom:
                configMapKeyRef:
                  name: tobogganing-config
                  key: HUB_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: hub-webui
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-webui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-webui
