# Secret keys shared across hub-api / hub-router via `envFrom.secretRef`
# (see hub-api-deployment.yaml, hub-router-deployment.yaml) — the deploy
# blocker this template fixes: those Deployments already referenced a
# `{{ include "tobogganing.fullname" . }}-secrets` Secret that never
# existed, so pods hit CreateContainerConfigError.
#
# Follows the postgres.password / hubRouter.sessionSigningKey precedent
# (see templates/hub-router-signing.yaml) — `required`-gated, NEVER a
# committed real value. Alpha commits a throwaway dev-only placeholder
# (values-alpha.yaml); beta/gamma/production intentionally leave
# secrets.* unset so this template's `required` fails the render unless
# injected via `--set secrets.dbPass=... --set secrets.licenseKey=...
# --set secrets.posthogKey=...` (CI-managed secret) at deploy time.
#
# NOTE: filename is `credentials.yaml`, NOT `secrets.yaml` — the repo
# root .gitignore has a blanket `*secret*` rule (line 16) that would
# silently exclude a `templates/secrets.yaml` from git entirely (same
# trap hub-router-signing.yaml's own filename already avoids).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tobogganing.fullname" . }}-secrets
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-config
type: Opaque
stringData:
  DB_PASS: {{ required "secrets.dbPass is required — inject via --set secrets.dbPass=... from a CI-managed secret at deploy time, never commit a real value to a values file" .Values.secrets.dbPass | quote }}
  LICENSE_KEY: {{ required "secrets.licenseKey is required — inject via --set secrets.licenseKey=... from a CI-managed secret at deploy time, never commit a real value to a values file" .Values.secrets.licenseKey | quote }}
  POSTHOG_KEY: {{ required "secrets.posthogKey is required — inject via --set secrets.posthogKey=... from a CI-managed secret at deploy time, never commit a real value to a values file" .Values.secrets.posthogKey | quote }}
