{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tobogganing.fullname" . }}-grafana-dashboard
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
    grafana_dashboard: "true"
data:
  tobogganing-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Tobogganing Zero Trust SASE Platform Overview",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Hub API - Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{service=\"hub-api\"}[5m])",
              "legendFormat": "{{`{{method}}`}} {{`{{status}}`}}"
            }
          ]
        },
        {
          "title": "Hub API - Response Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service=\"hub-api\"}[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"hub-api\"}[5m]))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "Hub Router - Active WireGuard Peers",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "wireguard_peers_active",
              "legendFormat": "Active Peers"
            }
          ]
        },
        {
          "title": "Hub Router - Traffic Throughput",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 6, "y": 8 },
          "targets": [
            {
              "expr": "rate(wireguard_bytes_transmitted_total[5m])",
              "legendFormat": "TX"
            },
            {
              "expr": "rate(wireguard_bytes_received_total[5m])",
              "legendFormat": "RX"
            }
          ]
        },
        {
          "title": "Hub Router - XDP Packets Processed",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 8 },
          "targets": [
            {
              "expr": "rate(xdp_packets_processed_total[5m])",
              "legendFormat": "{{`{{action}}`}}"
            }
          ]
        },
        {
          "title": "Resource Usage - CPU",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"{{ include "tobogganing.namespace" . }}\"}[5m])",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        },
        {
          "title": "Resource Usage - Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=\"{{ include "tobogganing.namespace" . }}\"}",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["tobogganing", "sase", "zero-trust"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Tobogganing Overview",
      "uid": "tobogganing-overview"
    }
{{- end }}
