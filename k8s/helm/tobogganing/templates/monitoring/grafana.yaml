{{- /*
  hub-router does not yet emit wireguard_* or xdp_* metrics (no WireGuard
  peer/traffic or XDP packet instrumentation exists in services/hub-router
  today) — those panels were removed rather than shipped pointing at
  nonexistent series. hub-router DOES emit http_requests_total{path,method,
  status} (services/hub-router/proxy/middleware/metrics.go), which backs the
  "Hub Router - Request Rate" panel below. Re-add WireGuard/XDP panels once
  that instrumentation lands.
*/}}
{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tobogganing.fullname" . }}-grafana-dashboard
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
    grafana_dashboard: "true"
data:
  tobogganing-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Tobogganing Zero Trust SASE Platform Overview",
      "editable": true,
      "gnetId": null,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Hub API - Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{service=\"hub-api\"}[5m])",
              "legendFormat": "{{`{{method}}`}} {{`{{status}}`}}"
            }
          ]
        },
        {
          "title": "Hub API - Response Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service=\"hub-api\"}[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{service=\"hub-api\"}[5m]))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "title": "Hub Router - Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"hub-router\"}[5m])",
              "legendFormat": "{{`{{method}}`}} {{`{{status}}`}}"
            }
          ]
        },
        {
          "title": "Resource Usage - CPU",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{namespace=\"{{ include "tobogganing.namespace" . }}\"}[5m])",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        },
        {
          "title": "Resource Usage - Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=\"{{ include "tobogganing.namespace" . }}\"}",
              "legendFormat": "{{`{{pod}}`}}"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["tobogganing", "sase", "zero-trust"],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "title": "Tobogganing Overview",
      "uid": "tobogganing-overview"
    }
{{- end }}
