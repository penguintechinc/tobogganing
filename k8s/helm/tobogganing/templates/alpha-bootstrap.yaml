apiVersion: v1
kind: Secret
metadata:
  name: netsvcs-dns-bootstrap
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: "alpha-bootstrap-token-12345"
---
apiVersion: v1
kind: Secret
metadata:
  name: node-agent-bootstrap
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: "alpha-bootstrap-token-67890"
---
apiVersion: v1
kind: Secret
metadata:
  name: tobogganing-node-agent-machine-jwt
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
type: Opaque
stringData:
  machine-jwt: "alpha-placeholder-jwt-token-replace-with-real-value"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tobogganing-node-agent-config
  namespace: {{ include "tobogganing.namespace" . }}
  labels:
    {{- include "tobogganing.labels" . | nindent 4 }}
data:
  config.yaml: |
    control_plane:
      url: "http://hub-api:8080"
      grpc_addr: "hub-api:50051"
    instance:
      hostname: "node-agent-alpha"
      region: "local"
{{- end }}
