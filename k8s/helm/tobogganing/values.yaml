## Tobogganing - Default Helm Values
## Zero Trust SASE Platform

namespace: tobogganing

## Shared image defaults, auto-injected by Helm into every sub-chart as
## `.Values.global.*` (netsvcs-dns/node-agent/SASE tools). Per-service
## `image.repository`/`image.tag` remain authoritative and always take
## precedence — `global.image.pullPolicy` is the only field actually
## consumed as a fallback today (see hub-api/hub-router/hub-webui/
## node-agent/netsvcs-dns templates); registry/tag are declared here for
## documentation/future consolidation, not yet wired as overrides.
global:
  image:
    registry: ghcr.io/penguintechinc/tobogganing
    tag: ""
    pullPolicy: IfNotPresent

## Hub API Service
hubApi:
  image:
    repository: tobogganing/hub-api
    tag: latest
    digest: ""  # Set (sha256:...) for production — see values-production.yaml
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  grpcPort: 50051
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  probes:
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

## Hub Router Service
hubRouter:
  image:
    repository: tobogganing/hub-router
    tag: latest
    digest: ""  # Set (sha256:...) for production — see values-production.yaml
    pullPolicy: IfNotPresent
  replicas: 1
  ports:
    wireguard: 51820
    https: 8443
    metrics: 9090
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - NET_ADMIN
        - SYS_MODULE
  probes:
    liveness:
      exec:
        command:
          - /app/healthcheck
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      exec:
        command:
          - /app/healthcheck
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
  hostNetwork: false
  sysctls:
    - name: net.ipv4.ip_forward
      value: "1"
    - name: net.ipv4.conf.all.src_valid_mark
      value: "1"

## Hub WebUI Service
hubWebui:
  image:
    repository: tobogganing/hub-webui
    tag: latest
    digest: ""  # Set (sha256:...) for production — see values-production.yaml
    pullPolicy: IfNotPresent
  replicas: 2
  port: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  probes:
    liveness:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

## Redis
redis:
  image:
    repository: redis
    tag: 7-bookworm
    pullPolicy: IfNotPresent
  replicas: 1
  port: 6379
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  storage:
    size: 1Gi
    storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    allowPrivilegeEscalation: false

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: tobogganing.penguintech.io
      paths:
        - path: /api
          pathType: Prefix
          service: hub-api
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
  tls:
    - secretName: tobogganing-tls
      hosts:
        - tobogganing.penguintech.io

## Autoscaling
autoscaling:
  enabled: false
  hubApi:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  hubWebui:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

## Monitoring
monitoring:
  enabled: true
  prometheus:
    scrapeInterval: 30s
  grafana:
    enabled: true

## Service Account
serviceAccount:
  create: true
  name: tobogganing
  annotations: {}

## Config
config:
  logLevel: info
  hubApiUrl: "http://hub-api:8080"
  hubRouterMetricsUrl: "http://hub-router:9090"
  redisUrl: "redis://redis:6379"
  dbType: "sqlite"

## ---------------------------------------------------------------------
## netsvcs-dns + node-agent (squawk -> netsvcs merge, P5-C)
## ---------------------------------------------------------------------
## Core sub-charts, ON by default — relocated from
## engines/netsvcs-dns/k8s/helm and k8s/helm/node-agent (see Chart.yaml).
## Overrides here are merged into each sub-chart's own values.yaml/
## values-<env>.yaml defaults via standard Helm dependency value passing
## (parent `netsvcs-dns:`/`node-agent:` key -> sub-chart root). See
## charts/netsvcs-dns/values.yaml and charts/node-agent/values.yaml for
## the full field set (env, probes, securityContext, etc.) not repeated
## here.

## DNS resolver fleet-node (DoH/DoT) DaemonSet — talks to hub-api over
## gRPC :50051 for CheckIOC lookups and config-sync (see
## templates/networkpolicy.yaml allow-netsvcs-grpc rules).
netsvcs-dns:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/netsvcs-dns
    tag: latest
    digest: ""  # Set (sha256:...) for production — see values-production.yaml

## Unified Rust DaemonSet (SASE connectivity + netsvcs-edge DNS/DHCP/NTP)
## — control-plane calls to hub-api over gRPC :50051 (see
## templates/networkpolicy.yaml allow-netsvcs-grpc rules). Keeps its own
## NET_ADMIN/NET_BIND_SERVICE root exception and :53 binding — see
## charts/node-agent/values.yaml nodeAgent.securityContext.
node-agent:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/node-agent
    tag: beta-1724152800
    digest: ""  # Set (sha256:...) for production — see values-production.yaml

## WaddlePerf testserver Go engine (data-plane target for
## hub_api/modules/perftest_cluster — http/tcp/udp/icmp/traceroute +
## speedtest/throughput tests). Default ON: without it, intra-cluster perf
## tests have no engine to hit. See charts/testserver/values.yaml for the
## full field set and KNOWN GAP notes (no bundled MariaDB — must be
## provisioned separately; ping/traceroute binaries missing from the
## Dockerfile runtime image affect ICMP/traceroute test types only).
testserver:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/testserver
    tag: latest
    digest: ""  # Set (sha256:...) for production — see values-production.yaml

## ---------------------------------------------------------------------
## Optional out-of-band analysis tools (SASE Slice D adapters)
## ---------------------------------------------------------------------
## Suricata, Zeek, Arkime, Strelka, and CAPE ship as OFF-BY-DEFAULT Helm
## sub-charts (see Chart.yaml `dependencies:` + `charts/<tool>/`). The
## baseline product deploys without any of them.
##
## Enabling a tool here (`<tool>.enabled: true`) only deploys its pod +
## Service. To actually turn on detection you must ALSO:
##   1. Enable the community-tier flag `tobogganing.sase.adapters`
##      (hub_api sase module contract — Entitlement("sase.adapters",
##      "community"), default OFF).
##   2. Configure hub-api's adapter poller to reach the tool via the
##      {SOURCE}_ENABLED / {SOURCE}_ENDPOINT / {SOURCE}_LOG_PATH env vars
##      read by hub_api/modules/sase/security/adapters/config.py
##      (source = suricata|zeek|strelka|cape|arkime), pointed at the
##      endpoint/logPath values configured below for each tool.
## See k8s/helm/tobogganing/charts/README.md for the full
## mirror -> tool -> adapter -> blocklist flow and known integration gaps.

## Suricata IDS — the one tool hub-router's Go mirror already wires a raw
## TCP feed to (mirror.suricata_host/mirror.suricata_port, default port
## 9999 — services/hub-router/proxy/bootstrap.go).
suricata:
  enabled: false
  image:
    repository: jasonish/suricata
    tag: "7.0.7"
    digest: "sha256:b76d6bc42a572757d01b9289f1da250c6414ae69183505f694f75cd14025129f"
    pullPolicy: IfNotPresent
  replicas: 1
  mirror:
    port: 9999
  eve:
    logPath: /var/log/suricata/eve.json
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

## Zeek network security monitor — log-based in this deployment (no live
## mirror wiring yet; only Suricata has that today). Establishes the
## deployable pattern for when a traffic source is added.
zeek:
  enabled: false
  image:
    repository: zeek/zeek
    tag: "6.2.1"
    digest: "sha256:825d7f338cb539fa0e937cab5a68a4859e696cdc851dc06428a3961e6bb16014"
    pullPolicy: IfNotPresent
  replicas: 1
  notice:
    logPath: /usr/local/zeek/logs/current/notice.log
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

## Arkime full-packet-capture/session viewer. No maintained public image
## with verifiable provenance was found for this tool (checked Docker Hub
## + GHCR) — the sub-chart ships as a stub with NO default image; set
## arkime.image.* before enabling. See charts/arkime/values.yaml.
arkime:
  enabled: false
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  viewer:
    port: 8005
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

## Strelka file-scanning/YARA pipeline (Target's target/strelka-frontend —
## the gRPC-facing component a poller submits scans to).
strelka:
  enabled: false
  image:
    repository: target/strelka-frontend
    tag: "1.0.1"
    digest: "sha256:5a713323733240c2028a49e01a008d35aeb955239b75e11d8cb86300369ab524"
    pullPolicy: IfNotPresent
  replicas: 1
  frontend:
    port: 57314
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

## CAPE sandbox. No safe generic container image exists upstream — CAPE's
## architecture requires a hypervisor (VirtualBox/KVM) to detonate
## samples, which is out of scope for a single stub pod. Ships with NO
## default image; set cape.image.* (and provision the sandbox hosts
## separately) before enabling. See charts/cape/values.yaml.
cape:
  enabled: false
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  api:
    port: 8000
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
