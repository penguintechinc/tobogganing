## Tobogganing - Beta Environment Overrides
## Moderate resources for staging/QA

namespace: tobogganing

hubApi:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  managerUrl: "https://tobogganing.penguintech.cloud/api"
  corsOrigins: "https://tobogganing.penguintech.cloud"

hubRouter:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # hubRouter.sessionSigningKey intentionally left unset — injected via
  # `--set hubRouter.sessionSigningKey=$SIGNING_KEY` from a CI-managed
  # secret at deploy time, never committed. See values.yaml
  # hubRouter.sessionSigningKey comment; templates/hub-router-signing.yaml
  # fails the render (by design) if this is omitted at deploy time.

hubWebui:
  replicas: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

redis:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  storage:
    size: 1Gi

## netsvcs-dns: CI-built beta image (mirrors charts/netsvcs-dns/beta.yml)
netsvcs-dns:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/netsvcs-dns
    tag: beta-1710000000  # Replaced by CI/CD with actual build tag
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

## node-agent: CI-built beta image (mirrors charts/node-agent/values-beta.yaml)
node-agent:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/node-agent
    tag: beta-1724152800  # Replaced by CI/CD with actual build tag
  nodeAgent:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

## testserver: CI-built beta image (mirrors charts/testserver/beta.yml)
testserver:
  enabled: true
  image:
    repository: ghcr.io/penguintechinc/tobogganing/testserver
    tag: beta-1710000000  # Replaced by CI/CD with actual build tag
  replicaCount: 1
  config:
    allowedOrigins: "https://tobogganing.penguintech.cloud"
  db:
    host: "testserver-mariadb.tobogganing.svc.cluster.local"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

autoscaling:
  enabled: false

config:
  logLevel: info

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: tobogganing.penguintech.cloud
      paths:
        - path: /api
          pathType: Prefix
          service: hub-api
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
  tls:
    - secretName: tobogganing-tls
      hosts:
        - tobogganing.penguintech.cloud
