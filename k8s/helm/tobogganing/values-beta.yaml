## Tobogganing - Beta Environment Overrides
## Moderate resources for staging/QA

namespace: tobogganing

hubApi:
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

hubRouter:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

hubWebui:
  replicas: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"

redis:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  storage:
    size: 1Gi

autoscaling:
  enabled: false

config:
  logLevel: info

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: tobogganing.penguintech.cloud
      paths:
        - path: /api
          pathType: Prefix
          service: hub-api
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
  tls:
    - secretName: tobogganing-tls
      hosts:
        - tobogganing.penguintech.cloud
