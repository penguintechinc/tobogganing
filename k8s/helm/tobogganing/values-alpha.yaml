## Tobogganing - Alpha Environment Overrides
## Minimal resources for development/testing

namespace: tobogganing

hubApi:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  managerUrl: "http://tobogganing.localhost.local/api"
  corsOrigins: "http://tobogganing.localhost.local"

hubRouter:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  # Dev-only placeholder, generated once for local alpha use — never
  # reused in beta/gamma/production. See values.yaml
  # hubRouter.sessionSigningKey comment. (Low-entropy/human-readable by
  # design so secret scanners don't misclassify it as a leaked credential
  # — matches the postgres.password "alpha-dev-password-generated-once"
  # precedent; still >=32 bytes to satisfy the app's own length check.)
  sessionSigningKey: "alpha-dev-only-session-signing-key-generated-once-never-reuse-elsewhere"

hubWebui:
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

redis:
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  storage:
    size: 512Mi

## netsvcs-dns: local registry, NodePort exposure (mirrors
## charts/netsvcs-dns/alpha.yml for standalone parity)
netsvcs-dns:
  enabled: true
  image:
    repository: localhost:32000/netsvcs-dns
    tag: alpha-latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    ports:
      doh:
        nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

## node-agent: local registry (mirrors charts/node-agent/values-alpha.yaml)
node-agent:
  enabled: true
  image:
    repository: localhost:32000/tobogganing/node-agent
    tag: alpha-latest
    pullPolicy: IfNotPresent
  nodeAgent:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

## testserver: local registry, NodePort exposure (mirrors
## charts/testserver/alpha.yml for standalone parity)
testserver:
  enabled: true
  image:
    repository: localhost:32000/tobogganing/testserver
    tag: alpha-latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30081
  config:
    authEnabled: "false"
    maxConcurrentTests: "10"
    allowedOrigins: "http://tobogganing.localhost.local"
  db:
    host: "testserver-mariadb.tobogganing.svc.cluster.local"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

autoscaling:
  enabled: false

monitoring:
  enabled: false

config:
  logLevel: debug

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: tobogganing.localhost.local
      paths:
        - path: /api
          pathType: Prefix
          service: hub-api
          port: 8080
        - path: /
          pathType: Prefix
          service: hub-webui
          port: 80
  tls:
    - secretName: tobogganing-tls
      hosts:
        - tobogganing.localhost.local
