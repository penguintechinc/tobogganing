{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netsvcs-dns
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- toYaml .Values.labels | nindent 6 }}
{{- end }}
