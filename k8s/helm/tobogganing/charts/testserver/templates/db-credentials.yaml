# DB_PASS for testserver's own MySQL/PostgreSQL account (per-service DB
# credentials — never shared with hub_api's secrets.dbPass). This is the
# deploy blocker this template fixes: templates/deployment.yaml already
# references a `{{ .Values.db.passwordSecretName }}` Secret
# (testserver-db-credentials) via secretKeyRef that nothing ever created,
# so pods hit CreateContainerConfigError.
#
# Follows the umbrella templates/credentials.yaml / hub-router-signing.yaml
# `required`-gated pattern — NEVER a committed real value. Alpha commits a
# throwaway dev-only placeholder (alpha.yml) ONLY for db.type != sqlite;
# beta/gamma/production intentionally leave db.password unset so this
# template's `required` fails the render unless injected via
# `--set db.password=...` (CI-managed secret) at deploy time.
#
# Skipped entirely when db.type == "sqlite" (dev-tier only, in-memory or
# self-owned file — no password needed); templates/deployment.yaml's
# DB_PASS env var is gated on the same condition, so the two never
# disagree about whether a password is required.
#
# NOTE: filename is `db-credentials.yaml`, NOT `*secret*` — the repo root
# .gitignore has a blanket `*secret*` rule (line 16) that would silently
# exclude a templates/secret.yaml from git entirely (same trap
# credentials.yaml / hub-router-signing.yaml already avoid).
{{- if ne .Values.db.type "sqlite" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.db.passwordSecretName }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.db.passwordSecretKey }}: {{ required "db.password is required when db.type != \"sqlite\" — inject via --set db.password=... from a CI-managed secret at deploy time, never commit a real value to a values file" .Values.db.password | quote }}
{{- end }}
