# Production environment values for node-agent
# Customer production deployments

namespace: tobogganing

image:
  repository: ghcr.io/penguintechinc/tobogganing/node-agent
  tag: v0.1.0
  # No node-agent image is published to ghcr.io yet (checked 2026-11-27), so
  # there is no real digest to pin. requireDigest makes the render fail loudly
  # until the deployer supplies --set image.digest=sha256:<real>.
  digest: ""
  requireDigest: true
  pullPolicy: IfNotPresent

nodeAgent:
  mode: daemonset
  controlPlaneUrl: "https://hub-api.tobogganing.svc:8443"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Production: stricter pod disruption budget (maintain at least 1 running pod)
podDisruptionBudget:
  enabled: true
  minAvailable: 1
