apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-router
  namespace: tobogganing
  labels:
    app.kubernetes.io/name: tobogganing
    app.kubernetes.io/component: hub-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tobogganing
      app.kubernetes.io/component: hub-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tobogganing
        app.kubernetes.io/component: hub-router
    spec:
      serviceAccountName: tobogganing
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
      containers:
        - name: hub-router
          image: registry-dal2.penguintech.io/tobogganing/hub-router:latest
          ports:
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tobogganing-config
                  key: LOG_LEVEL
            - name: WG_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: tobogganing-secrets
                  key: WG_PRIVATE_KEY
          livenessProbe:
            exec:
              command:
                - /app/healthcheck
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/healthcheck
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
