version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - lll
    - misspell
    - nakedret
    - prealloc
    - whitespace
  disable:
    - depguard
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: log
              desc: use structured logging with logrus instead
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - gochecknoglobals
          - gochecknoinits
        path: _test\.go
      - linters:
          - funlen
        path: cmd/.*\.go
      - linters:
          - gochecknoglobals
        path: cmd/.*\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: error
formatters:
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
