[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/transport",
    "crates/connectivity",
    "crates/netsvcs-edge",
    "crates/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false
repository = "https://github.com/penguintechinc/tobogganing"

# Exact-pinned versions only (no `^`/`~`/bare `*`) per org dependency-pinning
# policy. Member crates consume these via `dep.workspace = true` so every
# crate in the workspace resolves to a single shared version.
[workspace.dependencies]
# core
async-trait = "=0.1.92"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
figment = "=0.10.19"
clap = "=4.6.6"
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = "=1.53.1"
tokio-util = "=0.7.19"

# observability — OTLP triad (traces/logs/metrics), versions match
# engines/testserver-rs's workspace pins for consistency across the org's
# Rust services. `opentelemetry` (API-only, no SDK) is also consumed by
# `node-agent-core`/`node-agent-connectivity` so histogram recording works
# from any crate via the process-global meter, without those crates
# depending on the (heavier) SDK/OTLP-exporter crates themselves.
opentelemetry = "=0.33.0"
opentelemetry_sdk = "=0.33.0"
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "=0.33.0"
tracing-opentelemetry = "=0.34.0"
# dev-only: generated OTLP collector service stubs (trace/logs/metrics),
# used solely to run an in-process mock collector in the telemetry smoke
# test — never a runtime dependency.
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic", "trace", "logs", "metrics"] }

# transport
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
reqwest = { version = "=0.13.4", default-features = false }
rustls = { version = "=0.23.45", default-features = false }

# workspace-internal crates — explicit `version` alongside `path` even
# though nothing outside this workspace ever resolves them from a registry;
# omitting it makes cargo-deny's `bans.wildcards = "deny"` treat every
# `workspace = true` consumer as an unpinned wildcard dependency.
node-agent-core = { path = "crates/core", version = "0.1.0" }
node-agent-transport = { path = "crates/transport", version = "0.1.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
