# cargo-deny configuration for the tobogganing node-agent workspace.
# Run: cargo deny check (advisories + licenses + bans + sources)

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# No ignores: machine-JWT signing now goes through `penguin_aaa::Es256Signer`
# (hand-rolled ES256 JWS framing over `p256`/`ring`, zero `rsa`-crate
# dependency) instead of `jsonwebtoken`'s `rust_crypto` feature bundle, so
# RUSTSEC-2023-0071 (Marvin Attack, RustCrypto `rsa` timing sidechannel)
# no longer reaches this workspace at all — verify with `cargo tree | grep rsa`.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # openssl/native-tls are forbidden org-wide — rustls only.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# penguin-aaa isn't published to crates.io yet — pinned to an immutable
# git tag (see `crates/core/Cargo.toml`) per the org's dependency-pinning
# policy for pre-registry internal packages.
allow-git = ["https://github.com/penguintechinc/penguin-libs"]
