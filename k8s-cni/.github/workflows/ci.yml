name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  IMAGE_NAME: tobogganing/cni

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.55.2
        working-directory: k8s-cni

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Install dependencies
      working-directory: k8s-cni
      run: |
        go mod download
        go mod verify
        
    - name: Run tests
      working-directory: k8s-cni
      run: |
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: k8s-cni/coverage.out
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec.sarif ./...'
        working-directory: k8s-cni
        
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: k8s-cni/gosec.sarif

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    strategy:
      matrix:
        arch: [amd64, arm64]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Build binary
      working-directory: k8s-cni
      env:
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
          VERSION=${GITHUB_SHA::8}
        fi
        
        go build \
          -ldflags "-s -w -X main.BuildVersion=${VERSION} -X main.GitCommit=${GITHUB_SHA}" \
          -o tobogganing-cni-linux-${{ matrix.arch }} \
          ./cmd/tobogganing-cni
          
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tobogganing-cni-linux-${{ matrix.arch }}
        path: k8s-cni/tobogganing-cni-linux-${{ matrix.arch }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: k8s-cni
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          GIT_COMMIT=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Kind
      uses: helm/kind-action@v1
      with:
        cluster_name: cni-test
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: tobogganing-cni-linux-amd64
        path: k8s-cni/
        
    - name: Load CNI binary into Kind
      working-directory: k8s-cni
      run: |
        chmod +x tobogganing-cni-linux-amd64
        kind load docker-image --name cni-test tobogganing/cni:test
        
    - name: Test CNI installation
      working-directory: k8s-cni
      run: |
        # Copy binary to Kind nodes
        for node in $(kind get nodes --name cni-test); do
          docker exec $node mkdir -p /opt/cni/bin
          docker cp tobogganing-cni-linux-amd64 $node:/opt/cni/bin/tobogganing
          docker exec $node chmod +x /opt/cni/bin/tobogganing
        done
        
        # Test binary execution
        kubectl get nodes
        
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker, integration-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create release archives
      run: |
        mkdir -p dist
        
        for arch in amd64 arm64; do
          tar -czf dist/tobogganing-cni-${GITHUB_REF_NAME#v}-linux-$arch.tar.gz \
            -C tobogganing-cni-linux-$arch tobogganing-cni-linux-$arch
          sha256sum dist/tobogganing-cni-${GITHUB_REF_NAME#v}-linux-$arch.tar.gz \
            > dist/tobogganing-cni-${GITHUB_REF_NAME#v}-linux-$arch.tar.gz.sha256
        done
        
    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << EOF
        ## Tobogganing CNI Plugin ${GITHUB_REF_NAME}
        
        ### Features
        - High-performance Kubernetes CNI plugin
        - WireGuard integration for secure pod networking
        - Integration with Tobogganing Manager
        - Support for AMD64 and ARM64 architectures
        
        ### Installation
        \`\`\`bash
        kubectl apply -f https://github.com/tobogganing/k8s-cni/releases/download/${GITHUB_REF_NAME}/daemonset.yaml
        \`\`\`
        
        ### Docker Images
        \`\`\`
        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}
        \`\`\`
        EOF
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release_notes.md
        files: |
          dist/*.tar.gz
          dist/*.sha256
          k8s-cni/deploy/*.yaml
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}