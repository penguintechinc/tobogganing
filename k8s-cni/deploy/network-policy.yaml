apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tobogganing-cni-system
  namespace: kube-system
  labels:
    app: tobogganing-cni
spec:
  podSelector:
    matchLabels:
      app: tobogganing-cni
  policyTypes:
  - Ingress
  - Egress
  egress:
  # Allow access to Tobogganing Manager
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow WireGuard traffic
  - to: []
    ports:
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 51821
    - protocol: UDP
      port: 51822
  # Allow communication with Kubernetes API
  - to: []
    ports:
    - protocol: TCP
      port: 6443
  ingress:
  # Allow monitoring and health checks
  - from: []
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tobogganing-pod-default
  namespace: default
  labels:
    app: tobogganing-cni
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  # Allow all egress by default for pods using Tobogganing
  # Security is enforced at the WireGuard/SASE layer
  - {}
  ingress:
  # Allow ingress from pods in the same namespace by default
  - from:
    - podSelector: {}
  # Allow ingress from system namespaces
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-public