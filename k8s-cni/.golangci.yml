# GolangCI-Lint configuration for Tobogganing CNI Plugin
# High-performance linting configuration optimized for network code

run:
  # Timeout for analysis
  timeout: 5m
  
  # Exit code when at least one issue was found
  issues-exit-code: 1
  
  # Include test files
  tests: true
  
  # Directories to skip
  skip-dirs:
    - vendor
    - build
    - dist

# Output configuration
output:
  # Format: colored-line-number|line-number|json|tab|checkstyle|code-climate|html|junit-xml|github-actions|teamcity
  format: colored-line-number
  
  # Print lines of code with issue
  print-issued-lines: true
  
  # Print linter name in the end of issue text
  print-linter-name: true
  
  # Make issues output unique by line
  uniq-by-line: true
  
  # Add a prefix to the output file references
  path-prefix: ""
  
  # Sort results by: file, line, column, severity
  sort-results: true

# Linters configuration
linters:
  # Disable all linters as default is true
  disable-all: true
  
  # Enable specific linters for high-performance networking code
  enable:
    # Code quality
    - errcheck      # Checks for unchecked errors
    - gosimple      # Simplifies code
    - govet         # Reports suspicious constructs
    - ineffassign   # Detects inefficient assignments
    - staticcheck   # Advanced static analysis
    - unused        # Checks for unused constants, variables, functions and types
    
    # Style and formatting
    - gofmt         # Checks whether code was gofmt-ed
    - goimports     # Checks missing or unreferenced package imports
    - misspell      # Finds commonly misspelled English words
    - whitespace    # Detects leading and trailing whitespace
    
    # Bugs and logic
    - bodyclose     # Checks whether HTTP response body is closed successfully
    - deadcode      # Finds unused code
    - goconst       # Finds repeated strings that could be replaced by a constant
    - gocritic      # Comprehensive diagnostic tool
    - gocyclo       # Computes and checks cyclomatic complexity
    - godot         # Checks if comments end in a period
    - golint        # Reports poor Go style
    - gosec         # Inspects source code for security problems
    - typecheck     # Type-checks Go code
    - unconvert     # Removes unnecessary type conversions
    - unparam       # Reports unused function parameters
    
    # Performance
    - prealloc      # Finds slice declarations that could potentially be preallocated
    
    # Concurrency (important for CNI)
    - govet         # Includes race condition detection

# Linters settings
linters-settings:
  # Govet settings
  govet:
    # Report about shadowed variables
    check-shadowing: true
    # Settings per analyzer
    settings:
      printf:
        # Comma-separated list of print function names to check
        funcs:
          - (github.com/sirupsen/logrus.FieldLogger).Infof
          - (github.com/sirupsen/logrus.FieldLogger).Warnf
          - (github.com/sirupsen/logrus.FieldLogger).Errorf
          - (github.com/sirupsen/logrus.FieldLogger).Fatalf
    
    # Enable all analyzers
    enable-all: true
    
    # Disable specific analyzers
    disable:
      - fieldalignment  # Too strict for this use case

  # Golint settings
  golint:
    min-confidence: 0.8

  # Goimports settings
  goimports:
    # Put imports beginning with prefix after 3rd-party packages
    local-prefixes: github.com/tobogganing/k8s-cni

  # Gosec settings
  gosec:
    # Include test files
    tests: true
    # Severity of issues to exclude
    severity: "low"
    # Available rules: https://github.com/securecodewarrior/gosec#available-rules
    excludes:
      - G204  # Subprocess launched with variable - needed for ip commands
      - G304  # File path provided as taint input - needed for reading configs

  # Gocyclo settings
  gocyclo:
    # Minimal complexity of function to report
    min-complexity: 15

  # Goconst settings
  goconst:
    # Minimal length of string constant
    min-len: 3
    # Minimum occurrences of constant string count to trigger issue
    min-occurrences: 3
    # Ignore test files
    ignore-tests: false
    # Look for existing constants matching the values
    match-constant: true
    # Search also for duplicated numbers
    numbers: false
    # Minimum value, only works with goconst.numbers
    min: 3
    # Maximum value, only works with goconst.numbers  
    max: 3
    # Ignore when constant is not used as function argument
    ignore-calls: true

  # Gocritic settings
  gocritic:
    # Enable multiple checks by tags
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    
    # Disable specific checks
    disabled-checks:
      - regexpMust      # Too strict for this use case
      - whyNoLint       # We prefer explicit comments
      - importShadow    # Can be useful in some cases
      - unnamedResult   # Sometimes unnamed results are clearer

  # Errcheck settings
  errcheck:
    # Report about not checking of errors in type assertions
    check-type-assertions: true
    # Report about assignment of errors to blank identifier
    check-blank: true
    # Ignore specific error types
    ignore: fmt:.*,io/ioutil:^Read.*

  # Unused settings
  unused:
    # Treat code as a program (not a library) and report unused exported identifiers
    check-exported: false

  # Whitespace settings
  whitespace:
    # Enforces newlines after every multi-line if statement
    multi-if: false
    # Enforces newlines after every multi-line function signature
    multi-func: false

  # Prealloc settings (important for performance)
  prealloc:
    # XXX: we don't recommend using this linter before doing performance profiling.
    # For most programs usage of prealloc will be a premature optimization.
    
    # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them
    simple: true
    # Report preallocation suggestions on range loops
    range-loops: true
    # Report preallocation suggestions on for loops
    for-loops: false

# Issues configuration
issues:
  # List of regexps of issue texts to exclude
  exclude:
    - "should have a package comment"
    - "don't use an underscore in package name"
  
  # Exclude files from linting
  exclude-files:
    - ".*\\.pb\\.go$"  # Generated protobuf files
    - ".*_test\\.go$"  # Be less strict with test files
  
  # Exclude by rule
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst
    
    # Exclude known linter issues that are false positives
    - path: pkg/wireguard/manager.go
      text: "G204: Subprocess launched with variable"
      linters:
        - gosec
    
    # Exclude shadow declaration issues in short variable declarations
    - linters:
        - govet
      text: "shadow: declaration of"
      path: pkg/
    
    # Ignore complexity in main packages
    - path: cmd/
      linters:
        - gocyclo
        - gocognit
  
  # Show only new issues created after git revision
  new-from-rev: ""
  
  # Show only new issues created in git patch with set file path
  new-from-patch: ""
  
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  
  # Maximum count of issues with the same text
  max-same-issues: 3
  
  # Fix found issues (if it's supported by the linter)
  fix: false

# Severity configuration
severity:
  # Default severity for issues
  default-severity: error
  
  # If set to true severity-rules regular expressions become case sensitive
  case-sensitive: false
  
  # Rules to override severity levels
  rules:
    - linters:
        - misspell
      severity: warning
    
    - linters:
        - golint
        - godot
      severity: info