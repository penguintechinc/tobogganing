# Repo-wide tool config for the pre-commit hooks (ruff, bandit).
# Not a packaging file — the services pin deps via requirements.in/.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "proto/*_pb2.py",
    "proto/*_pb2_grpc.py",
    "**/node_modules",
    "**/.venv",
    "**/migrations/versions",  # Alembic autogenerated
]

[tool.ruff.lint]
# Conservative, correctness-focused set — pyflakes (unused/undefined),
# pycodestyle errors/warnings, import sorting. Expand later if desired.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length is handled by ruff-format, not flagged as a lint error
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]      # re-exports
"**/tests/**" = ["F401", "F811"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules", ".worktrees"]
# B101 (assert) is expected in tests; tests are already excluded above.
