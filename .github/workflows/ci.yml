name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_HUB_API: ${{ github.repository }}/hub-api
  IMAGE_NAME_HUB_ROUTER: ${{ github.repository }}/hub-router
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Test Manager Service (Python)
  test-manager:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.13]
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('services/hub-api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd services/hub-api
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install pytest pytest-cov pytest-asyncio bandit[toml]

    - name: Run bandit (Python security scanner)
      run: |
        cd services/hub-api
        bandit -r . --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Lint with pylint
      run: |
        cd services/hub-api
        python3 -m pylint --rcfile=.pylintrc . || exit 0

    - name: Type check with mypy
      run: |
        cd services/hub-api
        python3 -m mypy . || exit 0

    - name: Test with pytest
      run: |
        cd services/hub-api
        python3 -m pytest tests/ -v --cov=. --cov-report=xml || exit 0

    - name: Upload coverage reports
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      with:
        file: ./services/hub-api/coverage.xml
        flags: manager
        name: manager-coverage

  # Test Headend Server (Go)
  test-headend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.24]
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('services/hub-router/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        cd services/hub-router
        go mod download

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6
      with:
        version: v1.64.8
        working-directory: services/hub-router
        args: --timeout=5m --out-format=colored-line-number

    - name: Run gosec (Go security scanner)
      uses: securego/gosec@5e5517beec77b8228ba43ec8d7cc22d82ed31924  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router/...'
      continue-on-error: true

    - name: Test with go test
      run: |
        cd services/hub-router
        go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage reports
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      with:
        file: ./services/hub-router/coverage.out
        flags: headend
        name: headend-coverage

  # Test Native Client (Go)
  test-client:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.24]
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-client-${{ hashFiles('clients/native/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-client-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Install GUI dependencies with fallbacks for different Ubuntu versions
        sudo apt-get install -y \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          pkg-config \
          build-essential || true
        
        # Try newer webkit first, fallback to older version
        sudo apt-get install -y libwebkit2gtk-4.1-dev || \
        sudo apt-get install -y libwebkit2gtk-4.0-dev || \
        echo "Warning: webkit2gtk not available, GUI features may be limited"
    
    - name: Install dependencies
      run: |
        cd clients/native
        go mod download
    
    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6
      with:
        version: v1.64.8
        working-directory: clients/native
        args: --build-tags=nogui --timeout=5m --out-format=colored-line-number
    
    - name: Test with go test
      run: |
        cd clients/native
        go test -tags=nogui -v -race -coverprofile=coverage.out ./... || exit 0
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
      with:
        file: ./clients/native/coverage.out
        flags: client
        name: client-coverage

  # Security scanning
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python for bandit
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python security scanner)
      run: |
        pip3 install bandit[toml]
        bandit -r services/hub-api --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Run gosec (Go security scanner)
      uses: securego/gosec@5e5517beec77b8228ba43ec8d7cc22d82ed31924  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router/... ./clients/native/...'
      continue-on-error: true

    - name: Run Trivy filesystem scanning
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        version: 'v0.69.3'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3  # v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

  # Build and push Docker images
  build-images:
    needs: [test-manager, test-headend, test-client, security-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        component: [manager, headend, client]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "tag=tobogganing-${{ matrix.component }}:${VERSION}-pr${{ github.event.number }}" >> $GITHUB_OUTPUT
        else
          echo "tag=tobogganing-${{ matrix.component }}:${VERSION}" >> $GITHUB_OUTPUT
        fi
    
    - name: Compute image tags
      id: tags
      run: |
        EPOCH=$(date +%s)
        VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
        REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
        IMAGE="${REGISTRY}/tobogganing-${{ matrix.component }}"
        REF="${{ github.ref_name }}"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAGS="${IMAGE}:${REF}"
        elif [[ "${REF}" == "main" ]]; then
          TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
        elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
          TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
        else
          TAGS="${IMAGE}:alpha-${EPOCH}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image - Manager
      if: matrix.component == 'manager'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./services/hub-api
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

    - name: Build and push Docker image - Headend
      if: matrix.component == 'headend'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./services/hub-router
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

    - name: Build and push Docker image - Client
      if: matrix.component == 'client'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./clients/docker
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

  # Build native client binaries
  build-native-client:
    needs: [test-client]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary_suffix: ""
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            binary_suffix: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary_suffix: ".exe"
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary_suffix: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary_suffix: ""
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Read version from .version file
      id: version
      shell: bash
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: 1.24

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-client-${{ hashFiles('clients/native/go.sum') }}

    - name: Install dependencies
      run: |
        cd clients/native
        go mod download

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      shell: bash
      run: |
        cd clients/native
        VERSION="${{ steps.version.outputs.version }}"
        if [ "${{ runner.os }}" = "Windows" ]; then
          BUILD_TIME=$(powershell -Command "Get-Date -UFormat '%Y-%m-%d_%H:%M:%S'")
        else
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        fi
        GIT_COMMIT="${{ github.sha }}"

        mkdir -p build

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BINARY_NAME="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}-pr${{ github.event.number }}${{ matrix.binary_suffix }}"
        else
          BINARY_NAME="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}${{ matrix.binary_suffix }}"
        fi

        go build -ldflags="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT} -w -s" \
          -o build/${BINARY_NAME} ./cmd/headless

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: native-client-${{ matrix.goos }}-${{ matrix.goarch }}
        path: clients/native/build/*
        retention-days: 7

  # Create release (only on tags)
  create-release:
    if: github.event_name == 'release'
    needs: [build-images, build-native-client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        path: ./artifacts

    - name: Create release packages
      run: |
        mkdir -p release-packages

        # Package native clients
        for dir in artifacts/native-client-*; do
          if [ -d "$dir" ]; then
            platform=$(basename "$dir" | sed 's/native-client-//')

            if [[ "$platform" == *"windows"* ]]; then
              cd "$dir" && zip -r "../../release-packages/tobogganing-client-${platform}.zip" . && cd -
            else
              cd "$dir" && tar -czf "../../release-packages/tobogganing-client-${platform}.tar.gz" . && cd -
            fi
          fi
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
      with:
        files: release-packages/*
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  # Integration tests
  integration-test:
    needs: [build-images]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Run integration tests
      run: |
        # Integration tests placeholder
        # Run basic connectivity tests
        echo "Integration tests would run here..."
        echo "This is a placeholder for actual integration test implementation"
        
        # Run basic connectivity tests
        echo "Integration tests would run here..."
        echo "This is a placeholder for actual integration test implementation"