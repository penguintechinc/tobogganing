name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_HUB_API: ${{ github.repository }}/hub-api
  IMAGE_NAME_HUB_ROUTER: ${{ github.repository }}/hub-router
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Test Manager Service (Python)
  test-manager:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('hub_api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install uv
      run: pip install --no-cache-dir uv==0.11.28

    - name: Install dependencies
      run: |
        cd hub_api
        uv pip install --system --require-hashes -r requirements.txt
        uv pip install --system --require-hashes -r requirements-kms.txt

    # pylint removed — ruff is the only Python linter/formatter (see
    # backend-python.md); this step was also silently no-op before removal
    # since pylint was never in hub_api/requirements*.txt (command-not-found,
    # masked by `|| exit 0`).

    - name: Type check with mypy (gate on NEW errors only; ~1453 pre-existing baselined)
      run: |
        pip install --no-cache-dir mypy==1.14.0 mypy-baseline==0.7.4
        cd hub_api
        # mypy exits non-zero whenever ANY error exists, baselined or not —
        # writing to a file first (instead of piping directly) keeps that
        # expected non-zero status from tripping GitHub Actions' default
        # `pipefail` and masking the real gate below, which is
        # mypy-baseline's own exit code (0 = no NEW errors).
        python -m mypy . > mypy-output.txt 2>&1 || true
        mypy-baseline filter --allow-unsynced --baseline-path .mypy-baseline.txt < mypy-output.txt

    - name: Test with pytest
      run: |
        cd hub_api
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=90

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
      with:
        file: ./hub_api/coverage.xml
        flags: manager
        name: manager-coverage

  # Test Headend Server (Go)
  test-headend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.24]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4  # v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('services/hub-router/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        cd services/hub-router
        go mod download

    - name: Lint with golangci-lint (gate on NEW issues only via PR diff — action-native, avoids a hardcoded/staleness-prone base ref since main lags the release branch)
      uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84  # v6
      with:
        version: latest
        working-directory: services/hub-router
        args: --timeout=5m --out-format=colored-line-number
        only-new-issues: true

    - name: Test with go test
      run: |
        cd services/hub-router
        go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
      with:
        file: ./services/hub-router/coverage.out
        flags: headend
        name: headend-coverage

  # Test Node Agent (Rust)
  test-node-agent:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master (2026-08)
      with:
        toolchain: "1.98.0"
        components: clippy, rustfmt

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481  # v2.9.4
      with:
        tool: cargo-llvm-cov

    - name: Cache cargo registry and build artifacts
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          agents/node-agent/target
        key: ${{ runner.os }}-cargo-node-agent-${{ hashFiles('agents/node-agent/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-node-agent-

    - name: Build (all targets)
      working-directory: agents/node-agent
      run: cargo build --all-targets

    - name: Clippy (deny warnings)
      working-directory: agents/node-agent
      run: cargo clippy --all-targets -- -D warnings

    - name: Test
      working-directory: agents/node-agent
      run: cargo test

    - name: Coverage (90% line minimum)
      working-directory: agents/node-agent
      run: cargo llvm-cov --workspace --fail-under-lines 90

  # Test netsvcs-dns (Python)
  test-netsvcs-dns:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c  # v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-netsvcs-dns-${{ hashFiles('engines/netsvcs-dns/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-netsvcs-dns-

    - name: Install dependencies
      run: |
        cd engines/netsvcs-dns
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Test with pytest
      run: |
        cd engines/netsvcs-dns
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=90

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
      with:
        file: ./engines/netsvcs-dns/coverage.xml
        flags: netsvcs-dns
        name: netsvcs-dns-coverage

  # Test Portal E2E (Playwright)
  test-portal-e2e:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
        cache-dependency-path: portal/package-lock.json

    - name: Install dependencies
      working-directory: portal
      run: npm ci

    - name: Install Playwright browsers
      working-directory: portal
      run: npx playwright install --with-deps chromium

    - name: Run Playwright e2e tests
      working-directory: portal
      run: npx playwright test

    - name: Clean up Playwright artifacts
      if: always()
      run: rm -rf /tmp/playwright-tobogganing

  # Security scanning
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python for bandit
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python security scanner, JSON artifact for GitHub Security tab)
      run: |
        pip install bandit[toml]
        bandit -r hub_api --format json --output bandit-results.json || true
      continue-on-error: true

    # Real gating run on the same inputs as above (Verification Integrity —
    # masking above is only legitimate because this follows it). Must pass
    # `-c pyproject.toml` explicitly: bandit does NOT auto-discover
    # pyproject.toml's `[tool.bandit] exclude_dirs = ["tests", ...]` even
    # with the toml extra installed, confirmed 2026-09-25 — without `-c`
    # this fails on 10 medium findings that are all `0.0.0.0`/tmpdir mock
    # values in hub_api/tests/ fixtures, not real issues. 0 med/high today
    # once tests/ is correctly excluded.
    - name: Gate on bandit medium/high findings
      run: bandit -r hub_api -ll -c pyproject.toml

    - name: Run gosec (Go security scanner, high severity only — no pre-existing findings once scoped correctly)
      uses: securego/gosec@5e5517beec77b8228ba43ec8d7cc22d82ed31924  # v2.25.0
      with:
        # Previous args (`./services/hub-router ./k8s-cni`, no trailing `/...`)
        # scanned 0 files: `./k8s-cni` doesn't exist in this repo, and without
        # `/...` gosec only scans hub-router's top-level package (no .go
        # files there — everything lives in subpackages). `-no-fail` masked
        # this being a no-op scan for as long as it existed. Fixed to
        # recursively scan the real module; k8s-cni removed since it has
        # never existed here.
        args: '-severity high -fmt json -out gosec-results.json ./services/hub-router/...'

    - name: Run Trivy filesystem scanning
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        trivy-version: 'v0.69.3'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3  # v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

  # Build and push Docker images
  build-images:
    needs: [test-manager, test-headend, security-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [manager, headend]

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "tag=tobogganing-${{ matrix.component }}:${VERSION}-pr${{ github.event.number }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=tobogganing-${{ matrix.component }}:${VERSION}" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate Docker tags
      id: meta
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          TAGS="${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:${VERSION}-pr${{ github.event.number }}"
        else
          TAGS="${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:${VERSION}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:latest"
          fi
        fi
        echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image - Manager
      if: matrix.component == 'manager'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: .
        file: ./hub_api/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

    - name: Build and push Docker image - Headend
      if: matrix.component == 'headend'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./services/hub-router
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

  # Security scanning (post-release artifact scan)
  # NOTE: pre-existing duplicate of the `security-scan` job above (line ~298) — renamed
  # to a unique id to fix an actionlint duplicate-key error. Previously this second
  # definition silently shadowed the first (bandit/gosec/trivy) under the same
  # `security-scan` id, so `build-images: needs: [..., security-scan]` was gating on
  # this Trivy-only job instead. Flagged, not otherwise changed — out of P5-E scope.
  security-scan-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        trivy-version: 'v0.69.3'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@8dca8a82e2fa1a2c8908956f711300f9c4a4f4f6  # v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Integration tests
  integration-test:
    needs: [build-images]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: pip install --no-cache-dir uv==0.11.28

    - name: Install dependencies
      run: |
        cd hub_api
        uv pip install --system --require-hashes -r requirements.txt
        uv pip install --system --require-hashes -r requirements-kms.txt

    - name: Run cross-module seam integration tests
      env:
        REDIS_URL: redis://localhost:6379
      run: make test-integration
