name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_HUB_API: ${{ github.repository }}/hub-api
  IMAGE_NAME_HUB_ROUTER: ${{ github.repository }}/hub-router
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Test Manager Service (Python)
  test-manager:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('services/hub-api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd services/hub-api
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install pytest pytest-cov pytest-asyncio bandit[toml]

    - name: Run bandit (Python security scanner)
      run: |
        cd services/hub-api
        bandit -r . --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Lint with pylint
      run: |
        cd services/hub-api
        python3 -m pylint --rcfile=.pylintrc . || exit 0

    - name: Type check with mypy
      run: |
        cd services/hub-api
        python3 -m mypy . || exit 0

    - name: Test with pytest
      run: |
        cd services/hub-api
        python3 -m pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=90

    - name: Upload coverage reports
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./services/hub-api/coverage.xml
        flags: manager
        name: manager-coverage

  # Test Headend Server (Go)
  test-headend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.24]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('services/hub-router/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        cd services/hub-router
        go mod download

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9
      with:
        version: v1.64.8
        working-directory: services/hub-router
        args: --timeout=5m --out-format=colored-line-number

    - name: Run gosec (Go security scanner)
      uses: securego/gosec@223e19b8856e00f02cc67804499a83f77e208f3c  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router/...'
      continue-on-error: true

    - name: Test with go test
      run: |
        cd services/hub-router
        # Run all tests; exclude wireguard/ from coverage — it requires kernel WireGuard modules
        go test -v -race \
          -coverpkg=./config/...,./proxy/... \
          -coverprofile=coverage.out \
          ./...
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
        echo "Total coverage (kernel-free packages): ${total}%"
        awk "BEGIN{if(${total}+0 < 90){print \"Coverage below 90%: ${total}%\"; exit 1}}"

    - name: Upload coverage reports
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./services/hub-router/coverage.out
        flags: headend
        name: headend-coverage

  # Test Native Client (Go)
  test-client:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go-version: [1.24]

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-client-${{ hashFiles('clients/native/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-client-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Install GUI dependencies with fallbacks for different Ubuntu versions
        sudo apt-get install -y \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          pkg-config \
          build-essential || true

        # Try newer webkit first, fallback to older version
        sudo apt-get install -y libwebkit2gtk-4.1-dev || \
        sudo apt-get install -y libwebkit2gtk-4.0-dev || \
        echo "Warning: webkit2gtk not available, GUI features may be limited"

    - name: Install dependencies
      run: |
        cd clients/native
        go mod download

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9
      with:
        version: v1.64.8
        working-directory: clients/native
        args: --build-tags=nogui --timeout=5m --out-format=colored-line-number

    - name: Test with go test
      run: |
        cd clients/native
        # Restrict coverage to testable internal packages.
        # internal/vpn and internal/overlay are excluded — they require kernel WireGuard
        # modules and OpenZiti network connectivity respectively (same precedent as
        # test-headend excluding wireguard/ for kernel module requirements).
        # cmd/ packages are entry-points only and excluded from coverage measurement.
        go test -tags=nogui -v -race \
          -coverpkg=./internal/auth/...,./internal/config/...,./internal/client/...,./internal/gui/...,./internal/logger/...,./internal/svc/...,./internal/tray/... \
          -coverprofile=coverage.out \
          ./...
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
        echo "Total coverage (kernel-free internal packages): ${total}%"
        awk "BEGIN{if(${total}+0 < 90){print \"Coverage below 90%: ${total}%\"; exit 1}}"

    - name: Upload coverage reports
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./clients/native/coverage.out
        flags: client
        name: client-coverage

  # Test WebUI (Node.js / React)
  test-webui:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Check out penguin-libs (local package dependencies)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        repository: penguintechinc/penguin-libs
        token: ${{ secrets.GITHUB_TOKEN }}
        path: penguin-libs

    - name: Rewrite local package paths for CI environment
      env:
        GITHUB_WORKSPACE_VAR: ${{ github.workspace }}
      run: |
        sed -i "s|file:/home/penguin/code/penguin-libs|file://${GITHUB_WORKSPACE_VAR}/penguin-libs|g" services/hub-webui/package.json

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/hub-webui/package.json

    - name: Install dependencies
      run: |
        cd services/hub-webui
        npm install

    - name: Lint
      run: |
        cd services/hub-webui
        npm run lint

    - name: Run npm audit
      run: |
        cd services/hub-webui
        npm audit --audit-level=high
      continue-on-error: true

    - name: Run unit tests with coverage
      run: |
        cd services/hub-webui
        npm run test:coverage -- --coverage.thresholds.lines=90 --coverage.thresholds.functions=90 --coverage.thresholds.branches=90 --coverage.thresholds.statements=90

    - name: Install Playwright browsers
      run: |
        cd services/hub-webui
        npx playwright install --with-deps chromium

    - name: Run Playwright e2e tests
      run: |
        cd services/hub-webui
        npx playwright test
      continue-on-error: true

    - name: Upload Playwright report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      if: always()
      with:
        name: playwright-report
        path: /tmp/playwright-tobogganing/
        retention-days: 7

    - name: Upload coverage reports
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6
      with:
        file: ./services/hub-webui/coverage/coverage-final.json
        flags: webui
        name: webui-coverage

  # Security scanning
  security-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Python for bandit
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python security scanner)
      run: |
        pip3 install bandit[toml]
        bandit -r services/hub-api --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Run gosec (Go security scanner)
      uses: securego/gosec@223e19b8856e00f02cc67804499a83f77e208f3c  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router/... ./clients/native/...'
      continue-on-error: true

    - name: Run Trivy filesystem scanning
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        version: 'v0.69.3'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'

  # Build and push Docker images with parallel multi-arch support
  build-platform:
    needs: [test-manager, test-headend, test-client, test-webui, security-scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: manager
            context: ./services/hub-api
            image_name: tobogganing-hub-api
          - service: headend
            context: ./services/hub-router
            image_name: tobogganing-hub-router
          - service: client
            context: ./clients/docker
            image_name: tobogganing-client
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          EPOCH=$(date +%s)
          VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
          REGISTRY="ghcr.io/${REPO}"
          IMAGE="${REGISTRY}/${{ matrix.image_name }}"
          ARCH_SUFFIX=$(echo "${{ matrix.platform }}" | sed 's|/|-|g')

          if [[ "${REF_TYPE}" == "tag" ]]; then
            TAGS="${IMAGE}:${REF_NAME}-${ARCH_SUFFIX}"
          elif [[ "${REF_NAME}" == "main" ]]; then
            TAGS="${IMAGE}:gamma-${EPOCH}-${ARCH_SUFFIX},${IMAGE}:${VERSION}-gamma-${ARCH_SUFFIX}"
          elif [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            TAGS="${IMAGE}:beta-${EPOCH}-${ARCH_SUFFIX},${IMAGE}:${VERSION}-beta-${ARCH_SUFFIX}"
          else
            TAGS="${IMAGE}:alpha-${EPOCH}-${ARCH_SUFFIX}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image - ${{ matrix.service }} (${{ matrix.platform }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.run_id }}
            GIT_COMMIT=${{ github.sha }}

  merge-manifests:
    if: github.event_name != 'pull_request'
    name: Merge Manifests - ${{ matrix.service }}
    needs: build-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: manager
            image_name: tobogganing-hub-api
          - service: headend
            image_name: tobogganing-hub-router
          - service: client
            image_name: tobogganing-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute final image tags and merge manifests
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
        run: |
          EPOCH=$(date +%s)
          VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
          REGISTRY="ghcr.io/${REPO}"
          IMAGE="${REGISTRY}/${{ matrix.image_name }}"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            FINAL_TAGS="${IMAGE}:${REF_NAME},${IMAGE}:latest"
            SOURCE_TAG="${REF_NAME}"
          elif [[ "${REF_NAME}" == "main" ]]; then
            FINAL_TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
            SOURCE_TAG="${VERSION}-gamma"
          elif [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            FINAL_TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
            SOURCE_TAG="${VERSION}-beta"
          else
            FINAL_TAGS="${IMAGE}:alpha-${EPOCH}"
            SOURCE_TAG="alpha-${EPOCH}"
          fi

          # Create manifest list from arch-specific images
          docker buildx imagetools create \
            -t "${FINAL_TAGS}" \
            "${IMAGE}:${SOURCE_TAG}-linux-amd64" \
            "${IMAGE}:${SOURCE_TAG}-linux-arm64"

  # Build native client binaries
  build-native-client:
    needs: [test-client]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary_suffix: ""
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            binary_suffix: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary_suffix: ".exe"
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary_suffix: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary_suffix: ""

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Read version from .version file
      id: version
      shell: bash
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: 1.24

    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-client-${{ hashFiles('clients/native/go.sum') }}

    - name: Install dependencies
      run: |
        cd clients/native
        go mod download

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
        VERSION_VAR: ${{ steps.version.outputs.version }}
        GIT_COMMIT_VAR: ${{ github.sha }}
        RUN_ID: ${{ github.run_id }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_NUMBER: ${{ github.event.number }}
      shell: bash
      run: |
        cd clients/native
        if [ "${{ runner.os }}" = "Windows" ]; then
          BUILD_TIME=$(powershell -Command "Get-Date -UFormat '%Y-%m-%d_%H:%M:%S'")
        else
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        fi

        mkdir -p build

        if [ "${EVENT_NAME}" = "pull_request" ]; then
          BINARY_NAME="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION_VAR}-pr${EVENT_NUMBER}${{ matrix.binary_suffix }}"
        else
          BINARY_NAME="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION_VAR}${{ matrix.binary_suffix }}"
        fi

        go build -ldflags="-X main.version=${VERSION_VAR} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT_VAR} -w -s" \
          -o build/"${BINARY_NAME}" ./cmd/headless

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: native-client-${{ matrix.goos }}-${{ matrix.goarch }}
        path: clients/native/build/*
        retention-days: 7

  # Create release (only on tags)
  create-release:
    if: github.event_name == 'release'
    needs: [build-platform, merge-manifests, build-native-client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Download all artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        path: ./artifacts

    - name: Create release packages
      run: |
        mkdir -p release-packages

        # Package native clients
        for dir in artifacts/native-client-*; do
          if [ -d "$dir" ]; then
            platform=$(basename "$dir" | sed 's/native-client-//')

            if [[ "$platform" == *"windows"* ]]; then
              cd "$dir" && zip -r "../../release-packages/tobogganing-client-${platform}.zip" . && cd -
            else
              cd "$dir" && tar -czf "../../release-packages/tobogganing-client-${platform}.tar.gz" . && cd -
            fi
          fi
        done

    - name: Upload release assets
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
      with:
        files: release-packages/*
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  # Integration tests
  integration-test:
    needs: [build-platform, merge-manifests]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Run integration tests
      run: |
        # Integration tests placeholder
        # Run basic connectivity tests
        echo "Integration tests would run here..."
        echo "This is a placeholder for actual integration test implementation"

        # Run basic connectivity tests
        echo "Integration tests would run here..."
        echo "This is a placeholder for actual integration test implementation"
