name: Manual Builds

# Manual workflow trigger for building specific components on-demand
on:
  workflow_dispatch:
    inputs:
      components:
        description: 'Components to build'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - go-clients
        - mobile-apps
        - docker-images
        - website
      build_type:
        description: 'Build Type'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      platforms:
        description: 'Target Platforms (for relevant components)'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - linux
        - windows
        - macos
        - android
        - ios
      upload_artifacts:
        description: 'Upload build artifacts'
        required: false
        default: true
        type: boolean
      create_draft_release:
        description: 'Create draft GitHub release (production only)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  GO_VERSION: '1.24'
  NODE_VERSION: '18'

jobs:
  # Build Go native clients
  build-go-clients:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'go-clients' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux builds
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            enabled: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            enabled: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'linux' }}
          # Windows builds
          - runner: windows-latest
            goos: windows
            goarch: amd64
            enabled: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'windows' }}
          # macOS builds
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            enabled: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            enabled: ${{ github.event.inputs.platforms == 'all' || github.event.inputs.platforms == 'macos' }}

    steps:
    - name: Skip if platform not selected
      if: ${{ matrix.enabled == 'false' }}
      run: echo "Skipping ${{ matrix.goos }}-${{ matrix.goarch }} build" && exit 0

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      if: ${{ matrix.enabled != 'false' }}

    - name: Set up Go
      if: ${{ matrix.enabled != 'false' }}
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Read version from .version file
      if: ${{ matrix.enabled != 'false' }}
      id: version
      shell: bash
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        # Add build type suffix for non-production builds
        if [[ "${{ github.event.inputs.build_type }}" != "production" ]]; then
          VERSION="${VERSION}-${{ github.event.inputs.build_type }}"
        fi
        echo "full_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Cache Go modules
      if: ${{ matrix.enabled != 'false' }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-client-${{ hashFiles('clients/native/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-client-

    - name: Install dependencies
      if: ${{ matrix.enabled != 'false' }}
      run: |
        cd clients/native
        go mod download

    - name: Set build configuration
      if: ${{ matrix.enabled != 'false' }}
      shell: bash
      run: |
        cd clients/native

        # Set API endpoint based on build type
        case "${{ github.event.inputs.build_type }}" in
          "production")
            API_ENDPOINT="https://api.tobogganing.com"
            ;;
          "staging")
            API_ENDPOINT="https://api-staging.tobogganing.com"
            ;;
          *)
            API_ENDPOINT="https://api-dev.tobogganing.com"
            ;;
        esac

        # Create build configuration
        cat > internal/config/build_config.go << EOF
        package config

        const (
            BuildType   = "${{ github.event.inputs.build_type }}"
            APIEndpoint = "${API_ENDPOINT}"
            Version     = "${{ steps.version.outputs.full_version }}"
        )
        EOF

    - name: Build native client
      if: ${{ matrix.enabled != 'false' }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      shell: bash
      run: |
        cd clients/native

        if [ "${{ runner.os }}" = "Windows" ]; then
          BUILD_TIME=$(powershell -Command "Get-Date -UFormat '%Y-%m-%d_%H:%M:%S'")
        else
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        fi

        VERSION="${{ steps.version.outputs.full_version }}"
        GIT_COMMIT="${{ github.sha }}"

        mkdir -p build

        # Set binary name and extension
        BINARY_NAME="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi

        # Build with optimizations
        go build -ldflags="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT} -w -s" \
          -o build/${BINARY_NAME} ./cmd/headless

        echo "Built: ${BINARY_NAME}"
        ls -la build/

    - name: Test binary
      if: ${{ matrix.enabled != 'false' && matrix.goos == runner.os }}
      shell: bash
      run: |
        cd clients/native/build
        BINARY=$(ls tobogganing-client-* | head -1)
        if [[ "${{ matrix.goos }}" == "windows" ]]; then
          ./${BINARY} --version
        else
          ./${BINARY} --version
        fi

    - name: Upload artifacts
      if: ${{ matrix.enabled != 'false' && github.event.inputs.upload_artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: go-client-${{ matrix.goos }}-${{ matrix.goarch }}
        path: clients/native/build/*
        retention-days: ${{ github.event.inputs.build_type == 'production' && '90' || '30' }}

  # Build Go headend proxy
  build-headend-proxy:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'go-clients' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        if [[ "${{ github.event.inputs.build_type }}" != "production" ]]; then
          VERSION="${VERSION}-${{ github.event.inputs.build_type }}"
        fi
        echo "full_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Cache Go modules
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-headend-${{ hashFiles('services/hub-router/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-headend-

    - name: Build headend proxy
      run: |
        cd services/hub-router
        go mod download

        VERSION="${{ steps.version.outputs.full_version }}"
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        GIT_COMMIT="${{ github.sha }}"

        mkdir -p build

        # Build for multiple platforms
        for GOOS in linux darwin; do
          for GOARCH in amd64 arm64; do
            echo "Building headend-proxy for ${GOOS}/${GOARCH}"
            env GOOS=${GOOS} GOARCH=${GOARCH} CGO_ENABLED=0 \
              go build -ldflags="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT} -w -s" \
              -o build/headend-proxy-${GOOS}-${GOARCH}-${VERSION} ./proxy
          done
        done

        ls -la build/

    - name: Upload headend proxy artifacts
      if: ${{ github.event.inputs.upload_artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: headend-proxy-builds
        path: services/hub-router/build/*
        retention-days: ${{ github.event.inputs.build_type == 'production' && '90' || '30' }}

  # Trigger mobile builds
  trigger-mobile-builds:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'mobile-apps' }}
    runs-on: ubuntu-24.04
    steps:
    - name: Trigger mobile build workflow
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
      with:
        script: |
          const platforms = '${{ github.event.inputs.platforms }}' === 'all' ? 'all' :
                           ['android', 'ios'].includes('${{ github.event.inputs.platforms }}') ?
                           '${{ github.event.inputs.platforms }}' : 'all';

          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'mobile-builds.yml',
            ref: context.ref,
            inputs: {
              build_type: '${{ github.event.inputs.build_type }}',
              platforms: platforms,
              upload_to_stores: 'false'
            }
          });

  # Build Docker images - per platform
  build-platform-docker-images:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'docker-images' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [manager, headend, client]
        platform: [linux/amd64, linux/arm64]
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Extract platform tuple
      id: platform
      run: |
        PLATFORM="${{ matrix.platform }}"
        OS="${PLATFORM%/*}"
        ARCH="${PLATFORM#*/}"
        echo "os=${OS}" >> $GITHUB_OUTPUT
        echo "arch=${ARCH}" >> $GITHUB_OUTPUT

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        if [[ "${{ github.event.inputs.build_type }}" != "production" ]]; then
          VERSION="${VERSION}-${{ github.event.inputs.build_type }}"
        fi
        echo "full_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      id: tags
      run: |
        EPOCH=$(date +%s)
        VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
        REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
        IMAGE="${REGISTRY}/tobogganing-${{ matrix.component }}"
        REF="${{ github.ref_name }}"
        ARCH="${{ steps.platform.outputs.arch }}"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAGS="${IMAGE}:${REF}-${ARCH}"
        elif [[ "${REF}" == "main" ]]; then
          TAGS="${IMAGE}:gamma-${EPOCH}-${ARCH},${IMAGE}:${VERSION}-gamma-${ARCH}"
        elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
          TAGS="${IMAGE}:beta-${EPOCH}-${ARCH},${IMAGE}:${VERSION}-beta-${ARCH}"
        else
          TAGS="${IMAGE}:alpha-${EPOCH}-${ARCH}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
      with:
        context: ${{ matrix.component == 'manager' && './services/hub-api' || matrix.component == 'headend' && './services/hub-router' || './clients/docker' }}
        platforms: ${{ matrix.platform }}
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=${{ matrix.component }}-${{ steps.platform.outputs.arch }}
        cache-to: type=gha,scope=${{ matrix.component }}-${{ steps.platform.outputs.arch }},mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.full_version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}
          BUILD_TYPE=${{ github.event.inputs.build_type }}

  # Merge platform-specific manifests
  merge-docker-manifests:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'docker-images' }}
    needs: [build-platform-docker-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [manager, headend, client]
    steps:
    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

        if [[ "${{ github.event.inputs.build_type }}" != "production" ]]; then
          VERSION="${VERSION}-${{ github.event.inputs.build_type }}"
        fi
        echo "full_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Compute manifest tags
      id: tags
      run: |
        EPOCH=$(date +%s)
        VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
        REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
        IMAGE="${REGISTRY}/tobogganing-${{ matrix.component }}"
        REF="${{ github.ref_name }}"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          FINAL_TAG="${IMAGE}:${REF}"
          SOURCE_TAGS="${IMAGE}:${REF}-amd64 ${IMAGE}:${REF}-arm64"
        elif [[ "${REF}" == "main" ]]; then
          FINAL_TAG="${IMAGE}:gamma-${EPOCH} ${IMAGE}:${VERSION}-gamma"
          SOURCE_TAGS="${IMAGE}:gamma-${EPOCH}-amd64 ${IMAGE}:gamma-${EPOCH}-arm64 ${IMAGE}:${VERSION}-gamma-amd64 ${IMAGE}:${VERSION}-gamma-arm64"
        elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
          FINAL_TAG="${IMAGE}:beta-${EPOCH} ${IMAGE}:${VERSION}-beta"
          SOURCE_TAGS="${IMAGE}:beta-${EPOCH}-amd64 ${IMAGE}:beta-${EPOCH}-arm64 ${IMAGE}:${VERSION}-beta-amd64 ${IMAGE}:${VERSION}-beta-arm64"
        else
          FINAL_TAG="${IMAGE}:alpha-${EPOCH}"
          SOURCE_TAGS="${IMAGE}:alpha-${EPOCH}-amd64 ${IMAGE}:alpha-${EPOCH}-arm64"
        fi
        echo "final_tag=${FINAL_TAG}" >> $GITHUB_OUTPUT
        echo "source_tags=${SOURCE_TAGS}" >> $GITHUB_OUTPUT

    - name: Create and push manifest
      run: |
        FINAL_TAGS=(${{ steps.tags.outputs.final_tag }})
        SOURCE_TAGS=(${{ steps.tags.outputs.source_tags }})

        for final_tag in "${FINAL_TAGS[@]}"; do
          echo "Creating manifest for: ${final_tag}"
          docker buildx imagetools create -t "${final_tag}" \
            "${SOURCE_TAGS[0]}" \
            "${SOURCE_TAGS[1]}"
        done

  # Build website
  build-website:
    if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'website' }}
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: website/package.json

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        cd website
        npm ci

    - name: Set build environment
      run: |
        cd website

        case "${{ github.event.inputs.build_type }}" in
          "production")
            echo "NEXT_PUBLIC_API_URL=https://api.tobogganing.com" > .env.production
            echo "NEXT_PUBLIC_MANAGER_URL=https://manager.tobogganing.com" >> .env.production
            ;;
          "staging")
            echo "NEXT_PUBLIC_API_URL=https://api-staging.tobogganing.com" > .env.staging
            echo "NEXT_PUBLIC_MANAGER_URL=https://manager-staging.tobogganing.com" >> .env.staging
            ;;
          *)
            echo "NEXT_PUBLIC_API_URL=https://api-dev.tobogganing.com" > .env.development
            echo "NEXT_PUBLIC_MANAGER_URL=https://manager-dev.tobogganing.com" >> .env.development
            ;;
        esac

        echo "NEXT_PUBLIC_VERSION=${{ steps.version.outputs.version }}" >> .env.${{ github.event.inputs.build_type }}

    - name: Build website
      run: |
        cd website
        npm run build

    - name: Upload website build
      if: ${{ github.event.inputs.upload_artifacts == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: website-build
        path: website/.next/
        retention-days: 30

  # Create draft release
  create-draft-release:
    if: ${{ github.event.inputs.create_draft_release == 'true' && github.event.inputs.build_type == 'production' }}
    needs: [build-go-clients, build-headend-proxy, merge-docker-manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Download all Go client artifacts
      if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'go-clients' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        pattern: go-client-*
        path: ./artifacts
        merge-multiple: true

    - name: Download headend proxy artifacts
      if: ${{ github.event.inputs.components == 'all' || github.event.inputs.components == 'go-clients' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
      with:
        name: headend-proxy-builds
        path: ./artifacts/headend

    - name: Create release packages
      run: |
        mkdir -p release-packages
        VERSION="${{ steps.version.outputs.version }}"

        # Package Go clients
        if [ -d "artifacts" ]; then
          for file in artifacts/tobogganing-client-*; do
            if [ -f "$file" ]; then
              basename=$(basename "$file")
              if [[ "$basename" == *"windows"* ]]; then
                zip -j "release-packages/${basename%.exe}.zip" "$file"
              else
                tar -czf "release-packages/${basename}.tar.gz" -C "$(dirname "$file")" "$(basename "$file")"
              fi
            fi
          done
        fi

        # Package headend binaries
        if [ -d "artifacts/headend" ]; then
          for file in artifacts/headend/headend-proxy-*; do
            if [ -f "$file" ]; then
              basename=$(basename "$file")
              tar -czf "release-packages/${basename}.tar.gz" -C "$(dirname "$file")" "$(basename "$file")"
            fi
          done
        fi

        # Create checksums
        cd release-packages
        sha256sum * > checksums.txt
        cd ..

    - name: Create draft release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
      with:
        tag_name: v${{ steps.version.outputs.version }}-draft
        name: "Tobogganing v${{ steps.version.outputs.version }} (Draft)"
        body: |
          ## Manual Build Release - v${{ steps.version.outputs.version }}

          This is a draft release created from manual build workflow.

          **Components Built:**
          - Components: ${{ github.event.inputs.components }}
          - Build Type: ${{ github.event.inputs.build_type }}
          - Platforms: ${{ github.event.inputs.platforms }}

          **Build Information:**
          - Commit: ${{ github.sha }}
          - Workflow Run: ${{ github.run_id }}
          - Triggered by: ${{ github.actor }}

          ## Downloads

          See attached artifacts for compiled binaries and packages.

          ## Docker Images

          Docker images are available at:
          - `ghcr.io/${{ github.repository }}/tobogganing-manager:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository }}/tobogganing-headend:${{ steps.version.outputs.version }}`
          - `ghcr.io/${{ github.repository }}/tobogganing-client:${{ steps.version.outputs.version }}`
        files: |
          release-packages/*
        draft: true
        prerelease: true

  # Summary job
  build-summary:
    if: always()
    needs: [build-go-clients, build-headend-proxy, trigger-mobile-builds, build-platform-docker-images, build-website, create-draft-release]
    runs-on: ubuntu-24.04
    steps:
    - name: Build Summary
      run: |
        echo "## Manual Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
        echo "- Components: ${{ github.event.inputs.components }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Type: ${{ github.event.inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
        echo "- Platforms: ${{ github.event.inputs.platforms }}" >> $GITHUB_STEP_SUMMARY
        echo "- Upload Artifacts: ${{ github.event.inputs.upload_artifacts }}" >> $GITHUB_STEP_SUMMARY
        echo "- Create Draft Release: ${{ github.event.inputs.create_draft_release }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Results:**" >> $GITHUB_STEP_SUMMARY
        echo "- Go Clients: ${{ needs.build-go-clients.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Headend Proxy: ${{ needs.build-headend-proxy.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Mobile Apps: ${{ needs.trigger-mobile-builds.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Docker Images: ${{ needs.build-platform-docker-images.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Website: ${{ needs.build-website.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Draft Release: ${{ needs.create-draft-release.result }}" >> $GITHUB_STEP_SUMMARY
