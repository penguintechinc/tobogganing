name: Docker Build and Push

on:
  push:
    branches:
      - main
      - develop
      - 'v*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/tobogganing

jobs:
  build-manager:
    name: Build Manager Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Compute image tags
        id: tags
        run: |
          EPOCH=$(date +%s)
          VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
          IMAGE="${REGISTRY}/tobogganing-hub-api"
          REF="${{ github.ref_name }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${IMAGE}:${REF}"
          elif [[ "${REF}" == "main" ]]; then
            TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
          elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
          else
            TAGS="${IMAGE}:alpha-${EPOCH}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Manager Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./services/hub-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-headend:
    name: Build Headend Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Compute image tags
        id: tags
        run: |
          EPOCH=$(date +%s)
          VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
          IMAGE="${REGISTRY}/tobogganing-hub-router"
          REF="${{ github.ref_name }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${IMAGE}:${REF}"
          elif [[ "${REF}" == "main" ]]; then
            TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
          elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
          else
            TAGS="${IMAGE}:alpha-${EPOCH}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Headend Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./services/hub-router
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-client:
    name: Build Docker Client Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Compute image tags
        id: tags
        run: |
          EPOCH=$(date +%s)
          VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
          REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
          IMAGE="${REGISTRY}/tobogganing-client"
          REF="${{ github.ref_name }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${IMAGE}:${REF}"
          elif [[ "${REF}" == "main" ]]; then
            TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
          elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
            TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
          else
            TAGS="${IMAGE}:alpha-${EPOCH}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker Client image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ./clients/docker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max