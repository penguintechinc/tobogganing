name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_MANAGER: ${{ github.repository }}/manager
  IMAGE_NAME_HEADEND: ${{ github.repository }}/headend
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client

jobs:
  # Build and test before release
  pre-release-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: 3.13
    
    - name: Set up Go 1.23
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: 1.24
    
    - name: Install Python dependencies
      run: |
        cd services/hub-api
        python3 -m pip install --upgrade pip
        pip3 install -r requirements.txt
        pip3 install pytest pytest-asyncio
    
    - name: Install Go dependencies
      run: |
        cd services/hub-router && go mod download
        cd clients/native && go mod download
    
    - name: Run Python tests
      run: |
        cd services/hub-api
        python3 -m pytest tests/ -v || exit 0
    
    - name: Run Go tests (headend)
      run: |
        cd services/hub-router
        go test -v ./... || exit 0
    
    - name: Run Go tests (client)
      run: |
        cd clients/native
        go test -v ./... || exit 0

  # Build release Docker images
  build-release-images:
    needs: [pre-release-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        component: [manager, headend, client]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Compute image tags
      id: tags
      run: |
        EPOCH=$(date +%s)
        VERSION=$(cat .version | tr -d '[:space:]' | sed 's/\.[^.]*$//')
        REGISTRY="${{ env.REGISTRY }}/${{ github.repository }}"
        IMAGE="${REGISTRY}/tobogganing-${{ matrix.component }}"
        REF="${{ github.ref_name }}"

        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          TAGS="${IMAGE}:${REF}"
        elif [[ "${REF}" == "main" ]]; then
          TAGS="${IMAGE}:gamma-${EPOCH},${IMAGE}:${VERSION}-gamma"
        elif [[ "${REF}" =~ ^v[0-9]+\.[0-9]+\.x$ ]]; then
          TAGS="${IMAGE}:beta-${EPOCH},${IMAGE}:${VERSION}-beta"
        else
          TAGS="${IMAGE}:alpha-${EPOCH}"
        fi
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
    
    - name: Build and push Docker image - Manager
      if: matrix.component == 'manager'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./manager
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}
    
    - name: Build and push Docker image - Headend
      if: matrix.component == 'headend'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./headend
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}
    
    - name: Build and push Docker image - Client
      if: matrix.component == 'client'
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
      with:
        context: ./clients/docker
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

  # Build native client binaries for all platforms
  build-native-clients:
    needs: [pre-release-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux builds
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: tobogganing-client-linux-amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            binary: tobogganing-client-linux-arm64
          # Windows builds
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: tobogganing-client-windows-amd64.exe
          # macOS builds (will create universal binary)
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary: tobogganing-client-darwin-amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: tobogganing-client-darwin-arm64
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: 1.24
    
    - name: Read version from .version file
      id: version
      shell: bash
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        cd clients/native
        
        if [ "${{ runner.os }}" = "Windows" ]; then
          BUILD_TIME=$(powershell -Command "Get-Date -UFormat '%Y-%m-%d_%H:%M:%S'")
        else
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        fi
        
        VERSION="${{ steps.version.outputs.version }}"
        GIT_COMMIT="${{ github.sha }}"
        
        mkdir -p build
        
        # Use consistent naming pattern: tobogganing-client-{os}-{arch}-{version}
        VERSIONED_BINARY="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          VERSIONED_BINARY="${VERSIONED_BINARY}.exe"
        fi
        
        go build -ldflags="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT} -w -s" \
          -o build/${VERSIONED_BINARY} ./cmd/headless
      shell: bash
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}
        path: clients/native/build/*
        retention-days: 30

  # Create macOS universal binary
  create-macos-universal:
    needs: [build-native-clients]
    runs-on: macos-latest
    steps:
    - name: Download macOS binaries
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: tobogganing-client-darwin-amd64
        path: ./amd64
    
    - name: Download macOS ARM64 binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: tobogganing-client-darwin-arm64
        path: ./arm64
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Create universal binary
      run: |
        mkdir -p build
        VERSION="${{ steps.version.outputs.version }}"
        
        # Find the actual binary files (they have version in the name now)
        AMD64_BINARY=$(find ./amd64 -name "tobogganing-client-darwin-amd64-*" | head -1)
        ARM64_BINARY=$(find ./arm64 -name "tobogganing-client-darwin-arm64-*" | head -1)
        
        if [ -n "$AMD64_BINARY" ] && [ -n "$ARM64_BINARY" ]; then
          lipo -create -output "build/tobogganing-client-darwin-universal-${VERSION}" \
            "$AMD64_BINARY" \
            "$ARM64_BINARY"
        else
          echo "Error: Could not find both AMD64 and ARM64 binaries"
          ls -la ./amd64/
          ls -la ./arm64/
          exit 1
        fi
    
    - name: Upload universal binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: tobogganing-client-darwin-universal
        path: build/*
        retention-days: 30

  # Create release packages
  create-release:
    needs: [build-release-images, build-native-clients, create-macos-universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        path: ./artifacts
    
    - name: Create release packages
      run: |
        mkdir -p release-packages
        VERSION="${{ steps.version.outputs.version }}"
        
        # Linux AMD64 package
        mkdir -p linux-amd64
        cp artifacts/tobogganing-client-linux-amd64/tobogganing-client-linux-amd64-${VERSION} linux-amd64/tobogganing-client
        chmod +x linux-amd64/tobogganing-client
        tar -czf release-packages/tobogganing-client-linux-amd64-${VERSION}.tar.gz -C linux-amd64 .
        
        # Linux ARM64 package  
        mkdir -p linux-arm64
        cp artifacts/tobogganing-client-linux-arm64/tobogganing-client-linux-arm64-${VERSION} linux-arm64/tobogganing-client
        chmod +x linux-arm64/tobogganing-client
        tar -czf release-packages/tobogganing-client-linux-arm64-${VERSION}.tar.gz -C linux-arm64 .
        
        # Windows package
        mkdir -p windows
        cp artifacts/tobogganing-client-windows-amd64/tobogganing-client-windows-amd64-${VERSION}.exe windows/tobogganing-client.exe
        cd windows && zip -r ../release-packages/tobogganing-client-windows-amd64-${VERSION}.zip . && cd ..
        
        # macOS Universal package
        mkdir -p macos
        cp artifacts/tobogganing-client-darwin-universal/tobogganing-client-darwin-universal-${VERSION} macos/tobogganing-client
        chmod +x macos/tobogganing-client
        tar -czf release-packages/tobogganing-client-darwin-universal-${VERSION}.tar.gz -C macos .
        
        # Create checksums
        cd release-packages
        sha256sum * > checksums.txt
        cd ..
    
    - name: Create example configuration files
      env:
        VERSION_TAG: ${{ steps.version.outputs.version }}
      run: |
        mkdir -p release-packages/examples
        python3 -c "import os; v=os.environ['VERSION_TAG']; os.makedirs('release-packages/examples', exist_ok=True); open('release-packages/examples/client-config.yaml', 'w').write('# Tobogganing Native Client Configuration\nmanager_url: https://your-manager.example.com:8000\napi_key: your-api-key-here\nclient_name: my-workstation\nclient_type: client_native\nauto_connect: true\nreconnect_interval: 30\nlog_level: info\nheadless: false\nservice_mode: false\ndns_servers:\n  - 10.200.0.1\n  - 1.1.1.1\n  - 8.8.8.8\nauth_refresh_threshold: 300\n'); open('release-packages/examples/docker-compose.yml', 'w').write(f'# Tobogganing Self-Hosted Deployment\nversion: 3.8\nservices:\n  redis:\n    image: redis:7-bookworm\n  manager:\n    image: ghcr.io/your-org/tobogganing/manager:{v}\n  headend:\n    image: ghcr.io/your-org/tobogganing/headend:{v}\n'); open('release-packages/examples/install.sh', 'w').write('#!/bin/bash\nset -e\necho Install from https://github.com/penguintechinc/tobogganing\n')"
        chmod +x release-packages/examples/install.sh

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="${{ github.repository }}"
        python3 -c "
        import os
        v = os.environ.get('VERSION', 'unknown')
        r = os.environ.get('REPO', 'penguintechinc/tobogganing')
        n = f'# Tobogganing Release v{v}\n\n## Features\n- WireGuard VPN termination\n- Multi-protocol proxy\n- Cross-platform clients\n\n## Docker Images\n- Manager: ghcr.io/{r}/tobogganing-manager:{v}\n- Headend: ghcr.io/{r}/tobogganing-headend:{v}\n- Client: ghcr.io/{r}/tobogganing-client:{v}\n\n## Security\n- Zero Trust Network Architecture (ZTNA)\n- Dual authentication: X.509 + JWT\n- All communications secured with mutual TLS\n'
        open('release-notes.md', 'w').write(n)
        "
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe  # v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "Tobogganing v${{ steps.version.outputs.version }}"
        body_path: release-notes.md
        files: |
          release-packages/*
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        generate_release_notes: true

  # Security scan of release images
  security-scan-release:
    needs: [build-release-images]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [manager, headend, client]
    steps:
    - name: Run Trivy vulnerability scanner on release images
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env[format('IMAGE_NAME_{0}', upper(matrix.component))] }}:${{ github.ref_name }}
        format: 'sarif'
        output: 'trivy-${{ matrix.component }}-results.sarif'
        version: 'v0.69.3'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3  # v3
      with:
        sarif_file: 'trivy-${{ matrix.component }}-results.sarif'
