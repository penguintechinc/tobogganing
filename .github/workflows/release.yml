name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_HUB_API: ${{ github.repository }}/hub-api
  IMAGE_NAME_HUB_ROUTER: ${{ github.repository }}/hub-router
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client

jobs:
  # Build and test before release
  pre-release-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: 3.13
    
    - name: Set up Go 1.24
      uses: actions/setup-go@v4
      with:
        go-version: 1.24
    
    - name: Install Python dependencies
      run: |
        cd services/hub-api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Install Go dependencies
      run: |
        cd services/hub-router && go mod download
        cd ../clients/native && go mod download
    
    - name: Run Python tests
      run: |
        cd services/hub-api
        python -m pytest tests/ -v || exit 0
    
    - name: Run Go tests (headend)
      run: |
        cd services/hub-router
        go test -v ./... || exit 0
    
    - name: Run Go tests (client)
      run: |
        cd clients/native
        go test -v ./... || exit 0

  # Build release Docker images
  build-release-images:
    needs: [pre-release-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        component: [manager, headend, client]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Generate Docker tags
      id: meta
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f1-2)
        
        TAGS="${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:${VERSION}"
        TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:${MINOR}"
        TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:${MAJOR}"
        TAGS="${TAGS},${{ env.REGISTRY }}/${{ github.repository }}/tobogganing-${{ matrix.component }}:latest"
        
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
    
    - name: Build and push Docker image - Manager
      if: matrix.component == 'manager'
      uses: docker/build-push-action@v5
      with:
        context: ./services/hub-api
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}
    
    - name: Build and push Docker image - Headend
      if: matrix.component == 'headend'
      uses: docker/build-push-action@v5
      with:
        context: ./services/hub-router
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}
    
    - name: Build and push Docker image - Client
      if: matrix.component == 'client'
      uses: docker/build-push-action@v5
      with:
        context: ./clients/docker
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_TIME=${{ github.run_id }}
          GIT_COMMIT=${{ github.sha }}

  # Build native client binaries for all platforms
  build-native-clients:
    needs: [pre-release-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Linux builds
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            binary: tobogganing-client-linux-amd64
          - runner: ubuntu-24.04
            goos: linux
            goarch: arm64
            binary: tobogganing-client-linux-arm64
          # Windows builds
          - runner: windows-latest
            goos: windows
            goarch: amd64
            binary: tobogganing-client-windows-amd64.exe
          # macOS builds (will create universal binary)
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            binary: tobogganing-client-darwin-amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            binary: tobogganing-client-darwin-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.24

    - name: Read version from .version file
      id: version
      shell: bash
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        cd clients/native
        
        if [ "${{ runner.os }}" = "Windows" ]; then
          BUILD_TIME=$(powershell -Command "Get-Date -UFormat '%Y-%m-%d_%H:%M:%S'")
        else
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        fi
        
        VERSION="${{ steps.version.outputs.version }}"
        GIT_COMMIT="${{ github.sha }}"
        
        mkdir -p build
        
        # Use consistent naming pattern: tobogganing-client-{os}-{arch}-{version}
        VERSIONED_BINARY="tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          VERSIONED_BINARY="${VERSIONED_BINARY}.exe"
        fi
        
        go build -ldflags="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT} -w -s" \
          -o build/${VERSIONED_BINARY} ./cmd/headless
      shell: bash
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v3
      with:
        name: tobogganing-client-${{ matrix.goos }}-${{ matrix.goarch }}
        path: clients/native/build/*
        retention-days: 30

  # Create macOS universal binary
  create-macos-universal:
    needs: [build-native-clients]
    runs-on: macos-latest
    steps:
    - name: Download macOS binaries
      uses: actions/download-artifact@v3
      with:
        name: tobogganing-client-darwin-amd64
        path: ./amd64
    
    - name: Download macOS ARM64 binary
      uses: actions/download-artifact@v3
      with:
        name: tobogganing-client-darwin-arm64
        path: ./arm64
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Create universal binary
      run: |
        mkdir -p build
        VERSION="${{ steps.version.outputs.version }}"
        
        # Find the actual binary files (they have version in the name now)
        AMD64_BINARY=$(find ./amd64 -name "tobogganing-client-darwin-amd64-*" | head -1)
        ARM64_BINARY=$(find ./arm64 -name "tobogganing-client-darwin-arm64-*" | head -1)
        
        if [ -n "$AMD64_BINARY" ] && [ -n "$ARM64_BINARY" ]; then
          lipo -create -output "build/tobogganing-client-darwin-universal-${VERSION}" \
            "$AMD64_BINARY" \
            "$ARM64_BINARY"
        else
          echo "Error: Could not find both AMD64 and ARM64 binaries"
          ls -la ./amd64/
          ls -la ./arm64/
          exit 1
        fi
    
    - name: Upload universal binary
      uses: actions/upload-artifact@v3
      with:
        name: tobogganing-client-darwin-universal
        path: build/*
        retention-days: 30

  # Create release packages
  create-release:
    needs: [build-release-images, build-native-clients, create-macos-universal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Read version from .version file
      id: version
      run: |
        VERSION=$(cat .version)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: ./artifacts
    
    - name: Create release packages
      run: |
        mkdir -p release-packages
        VERSION="${{ steps.version.outputs.version }}"
        
        # Linux AMD64 package
        mkdir -p linux-amd64
        cp artifacts/tobogganing-client-linux-amd64/tobogganing-client-linux-amd64-${VERSION} linux-amd64/tobogganing-client
        chmod +x linux-amd64/tobogganing-client
        tar -czf release-packages/tobogganing-client-linux-amd64-${VERSION}.tar.gz -C linux-amd64 .
        
        # Linux ARM64 package  
        mkdir -p linux-arm64
        cp artifacts/tobogganing-client-linux-arm64/tobogganing-client-linux-arm64-${VERSION} linux-arm64/tobogganing-client
        chmod +x linux-arm64/tobogganing-client
        tar -czf release-packages/tobogganing-client-linux-arm64-${VERSION}.tar.gz -C linux-arm64 .
        
        # Windows package
        mkdir -p windows
        cp artifacts/tobogganing-client-windows-amd64/tobogganing-client-windows-amd64-${VERSION}.exe windows/tobogganing-client.exe
        cd windows && zip -r ../release-packages/tobogganing-client-windows-amd64-${VERSION}.zip . && cd ..
        
        # macOS Universal package
        mkdir -p macos
        cp artifacts/tobogganing-client-darwin-universal/tobogganing-client-darwin-universal-${VERSION} macos/tobogganing-client
        chmod +x macos/tobogganing-client
        tar -czf release-packages/tobogganing-client-darwin-universal-${VERSION}.tar.gz -C macos .
        
        # Create checksums
        cd release-packages
        sha256sum * > checksums.txt
        cd ..
    
    - name: Create example configuration files
      run: |
        mkdir -p release-packages/examples
        python3 -c "
        import os, stat
        os.makedirs('release-packages/examples', exist_ok=True)
        with open('release-packages/examples/client-config.yaml', 'w') as f:
          f.write('# Tobogganing Native Client Configuration\n')
          f.write('manager_url: https://your-manager.example.com:8000\n')
          f.write('api_key: your-api-key-here\n')
          f.write('client_name: my-workstation\n')
          f.write('client_type: client_native\n')
          f.write('auto_connect: true\n')
          f.write('reconnect_interval: 30\n')
          f.write('log_level: info\n')
          f.write('headless: false\n')
          f.write('service_mode: false\n')
          f.write('dns_servers:\n  - 10.200.0.1\n  - 1.1.1.1\n  - 8.8.8.8\n')
          f.write('auth_refresh_threshold: 300\n')
        with open('release-packages/examples/docker-compose.yml', 'w') as f:
          f.write('# Tobogganing Self-Hosted Deployment Example\n')
          f.write("version: '3.8'\nservices:\n  redis:\n    image: redis:7-bookworm\n")
        with open('release-packages/examples/install.sh', 'w') as f:
          f.write('#!/bin/bash\nset -e\necho Install from https://github.com/penguintechinc/tobogganing\n')
        os.chmod('release-packages/examples/install.sh', 0o755)
        print('Example files created')
        "

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        REPO="${{ github.repository }}"
        python3 -c "
        import os
        version = os.environ.get('VERSION', 'unknown')
        repo = os.environ.get('REPO', 'penguintechinc/tobogganing')
        notes = (
          f'# Tobogganing Release v{version}\n\n'
          '## Features\n\n'
          '### Manager Service\n'
          '- Centralized orchestration with multi-datacenter support\n'
          '- X.509 certificate management with automatic rotation\n'
          '- JWT token management with Redis caching\n\n'
          '### Headend Server\n'
          '- WireGuard VPN termination with dual authentication\n'
          '- Multi-protocol proxy (HTTP/HTTPS, TCP, UDP)\n\n'
          '### Client Applications\n'
          '- Docker Client: Containerized deployment with auto-configuration\n'
          '- Native Client: Cross-platform binaries for Mac, Windows, Linux\n\n'
          f'## Docker Images\n'
          f'- Manager: ghcr.io/{repo}/tobogganing-manager:{version}\n'
          f'- Headend: ghcr.io/{repo}/tobogganing-headend:{version}\n'
          f'- Client:  ghcr.io/{repo}/tobogganing-client:{version}\n\n'
          '## Security\n'
          '- Zero Trust Network Architecture (ZTNA)\n'
          '- Dual authentication: X.509 certificates + JWT/SSO\n'
          '- All communications secured with mutual TLS\n\n'
          'All release assets are signed and checksums are in checksums.txt.\n'
        )
        open('release-notes.md', 'w').write(notes)
        print(f'Release notes written for v{version}')
        " || {
          echo "# Tobogganing Release ${VERSION}" > release-notes.md
          echo "See changelog for details." >> release-notes.md
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: "Tobogganing v${{ steps.version.outputs.version }}"
        body_path: release-notes.md
        files: |
          release-packages/*
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        generate_release_notes: true

  # Security scan of release images
  security-scan-release:
    needs: [build-release-images]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [manager, headend, client]
    steps:
    - name: Run Trivy vulnerability scanner on release images
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env[format('IMAGE_NAME_{0}', upper(matrix.component))] }}:${{ github.ref_name }}
        format: 'sarif'
        output: 'trivy-${{ matrix.component }}-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-${{ matrix.component }}-results.sarif'
