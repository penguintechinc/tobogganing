name: Release

# Prod image release pipeline. Fires ONLY on a genuine GitHub release
# (types: [released]) — never on bare tag push and never on `published`
# (which also fires for pre-releases and would defeat the prod gate).
# Builds + pushes multi-arch images for every service the umbrella Helm
# chart (k8s/helm/tobogganing/values.yaml) actually deploys,
# to ghcr.io/penguintechinc/tobogganing/<service>.

on:
  release:
    types: [released]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Fail-closed version gate: a missing/malformed tag must abort the whole
  # pipeline rather than silently building untagged/mistagged images.
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      patch: ${{ steps.parse.outputs.patch }}
    steps:
      - name: Parse and validate tag (v{Major}.{Minor}.{Patch}, v1.x+ only)
        id: parse
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_NAME}" ]; then
            echo "::error::Release tag_name is empty — refusing to build a prod release with no version." >&2
            exit 1
          fi
          if ! [[ "${TAG_NAME}" =~ ^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '${TAG_NAME}' does not match required v{Major}.{Minor}.{Patch} format (v1.x+ only)." >&2
            exit 1
          fi
          {
            echo "version=${TAG_NAME}"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

  # Build + push multi-arch images for every deployable service.
  build-and-push:
    name: Build & push ${{ matrix.service }}
    needs: [validate-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: hub-api
            context: ./hub_api
          - service: hub-router
            context: ./services/hub-router
          - service: hub-webui
            context: ./portal
          - service: netsvcs-dns
            context: ./engines/netsvcs-dns
          - service: node-agent
            context: ./agents/node-agent
          - service: testserver
            context: ./engines/testserver
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.validate-version.outputs.version }}
            type=raw,value=${{ needs.validate-version.outputs.major }}.${{ needs.validate-version.outputs.minor }}
            type=raw,value=${{ needs.validate-version.outputs.major }}
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}

  # Scan every image actually pushed to the registry before calling the
  # release done — never scan pre-build source only.
  security-scan-release:
    name: Trivy scan ${{ matrix.service }}
    needs: [validate-version, build-and-push]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - hub-api
          - hub-router
          - hub-webui
          - netsvcs-dns
          - node-agent
          - testserver
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          trivy-version: 'v0.69.3'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ needs.validate-version.outputs.version }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ebcb5b36ded6beda4ceefea6a8bc4cc885255bb3  # v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service }}-results.sarif'
          category: 'trivy-release-${{ matrix.service }}'
