name: Version File Monitoring

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.version'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.version'

env:
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    name: Validate Version Format

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 2

    - name: Check .version file exists
      run: |
        if [ ! -f .version ]; then
          echo "ERROR: .version file does not exist"
          exit 1
        fi
        echo "✓ .version file found"

    - name: Validate version format
      id: validate
      run: |
        VERSION=$(tr -d '[:space:]' < .version)
        echo "Version: $VERSION"

        # Check if version matches vMajor.Minor.Patch or vMajor.Minor.Patch.build
        if [[ ! $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "ERROR: Version format invalid: $VERSION"
          echo "Expected format: vMajor.Minor.Patch or vMajor.Minor.Patch.build"
          exit 1
        fi

        # Extract semantic version
        SEMVER=$(echo "$VERSION" | sed 's/v//;s/\.[0-9]*$//')
        BUILD=$(echo "$VERSION" | grep -oE '\.[0-9]+$' || echo "")

        echo "Semantic Version: $SEMVER"
        echo "Build Timestamp: ${BUILD:1}"
        echo "version=$SEMVER" >> "$GITHUB_OUTPUT"
        echo "build=${BUILD:1}" >> "$GITHUB_OUTPUT"

    - name: Log version metadata
      run: |
        VERSION=$(tr -d '[:space:]' < .version)
        echo "::notice::Version Detected: $VERSION"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Workflow Run: ${{ github.run_number }}"

  component-consistency:
    runs-on: ubuntu-24.04
    name: Check All Components Support Version

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Verify Hub API Service (Python 3.13)
      run: |
        echo "Hub API Service Version Check"
        [ -f "hub_api/app.py" ] && echo "  ✓ Hub API app.py found"
        [ -f "hub_api/requirements.txt" ] && echo "  ✓ Hub API requirements.txt found"

    - name: Verify Hub Router Service (Go 1.24)
      run: |
        echo "Hub Router Service Version Check"
        [ -f "services/hub-router/go.mod" ] && echo "  ✓ Hub Router go.mod found"
        [ -d "services/hub-router/proxy" ] && echo "  ✓ Hub Router proxy package found"

    - name: Verify K8s CNI Plugin (Go 1.24)
      run: |
        echo "K8s CNI Plugin Version Check"
        [ -f "k8s-cni/go.mod" ] && echo "  ✓ K8s CNI go.mod found"
        [ -d "k8s-cni/cmd/tobogganing-cni" ] && echo "  ✓ K8s CNI binary directory found"

    - name: Verify Frontend (Node.js 18)
      run: |
        echo "Frontend Version Check"
        [ -f "website/package.json" ] && echo "  ✓ Frontend package.json found"
        [ -d "website/src" ] && echo "  ✓ Frontend src directory found"

  security-check:
    runs-on: ubuntu-24.04
    name: Security Scanning with Version Context

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Set up Python for bandit
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python)
      run: |
        pip install bandit[toml]
        bandit -r hub_api --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Run gosec (Go)
      uses: securego/gosec@5e5517beec77b8228ba43ec8d7cc22d82ed31924  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router ./k8s-cni'
      continue-on-error: true

    - name: Report security scan summary
      run: |
        VERSION=$(tr -d '[:space:]' < .version)
        echo "Security Scan Results for Version: $VERSION"
        echo "========================================="

        if [ -f bandit-results.json ]; then
          echo "Python Security (bandit): Scanned"
        fi

        if [ -f gosec-results.json ]; then
          echo "Go Security (gosec): Scanned"
        fi
