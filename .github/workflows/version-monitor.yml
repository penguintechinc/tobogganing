name: Version File Monitoring

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.version'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.version'

env:
  GO_VERSION: '1.24'
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    name: Validate Version Format

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      with:
        fetch-depth: 2

    - name: Check .version file exists
      run: |
        if [ ! -f .version ]; then
          echo "ERROR: .version file does not exist"
          exit 1
        fi
        echo "✓ .version file found"

    - name: Validate version format
      id: validate
      run: |
        VERSION=$(cat .version | tr -d '[:space:]')
        echo "Version: $VERSION"

        # Check if version matches vMajor.Minor.Patch or vMajor.Minor.Patch.build
        if [[ ! $VERSION =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "ERROR: Version format invalid: $VERSION"
          echo "Expected format: vMajor.Minor.Patch or vMajor.Minor.Patch.build"
          exit 1
        fi

        # Extract semantic version
        SEMVER=$(echo "$VERSION" | sed 's/v//;s/\.[0-9]*$//')
        BUILD=$(echo "$VERSION" | grep -oE '\.[0-9]+$' || echo "")

        echo "Semantic Version: $SEMVER"
        echo "Build Timestamp: ${BUILD:1}"
        echo "version=$SEMVER" >> $GITHUB_OUTPUT
        echo "build=${BUILD:1}" >> $GITHUB_OUTPUT

    - name: Log version metadata
      run: |
        VERSION=$(cat .version | tr -d '[:space:]')
        echo "::notice::Version Detected: $VERSION"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Workflow Run: ${{ github.run_number }}"

  component-consistency:
    runs-on: ubuntu-24.04
    name: Check All Components Support Version

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Verify Manager Service (Python 3.13)
      run: |
        echo "Manager Service Version Check"
        [ -f "services/hub-api/app.py" ] && echo "  ✓ Manager app.py found"
        [ -f "services/hub-api/requirements.txt" ] && echo "  ✓ Manager requirements.txt found"

    - name: Verify Headend Server (Go 1.24)
      run: |
        echo "Headend Server Version Check"
        [ -f "services/hub-router/go.mod" ] && echo "  ✓ Headend go.mod found"
        [ -d "services/hub-router/proxy" ] && echo "  ✓ Headend proxy package found"

    - name: Verify Docker Client (Go 1.24)
      run: |
        echo "Docker Client Version Check"
        [ -f "clients/docker/Dockerfile" ] && echo "  ✓ Docker Client Dockerfile found"

    - name: Verify Native Clients (Go 1.24)
      run: |
        echo "Native Clients Version Check"
        [ -f "clients/native/go.mod" ] && echo "  ✓ Native Client go.mod found"
        [ -d "clients/native/cmd" ] && echo "  ✓ Native Client cmd directory found"

    - name: VerifyFrontend (Node.js 18)
      run: |
        echo "Frontend Version Check"
        [ -f "services/hub-webui/package.json" ] && echo "  ✓ Frontend package.json found"
        [ -d "services/hub-webui/src" ] && echo "  ✓ Frontend src directory found"

  security-check:
    runs-on: ubuntu-24.04
    name: Security Scanning with Version Context

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

    - name: Set up Python for bandit
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Go for gosec
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run bandit (Python)
      run: |
        pip install bandit[toml]
        bandit -r services/hub-api --format json --output bandit-results.json || true
      continue-on-error: true

    - name: Run gosec (Go)
      uses: securego/gosec@223e19b8856e00f02cc67804499a83f77e208f3c  # v2.25.0
      with:
        args: '-no-fail -fmt json -out gosec-results.json ./services/hub-router ./clients/native ./k8s-cni'
      continue-on-error: true

    - name: Report security scan summary
      run: |
        VERSION=$(cat .version | tr -d '[:space:]')
        echo "Security Scan Results for Version: $VERSION"
        echo "========================================="

        if [ -f bandit-results.json ]; then
          echo "Python Security (bandit): Scanned"
        fi

        if [ -f gosec-results.json ]; then
          echo "Go Security (gosec): Scanned"
        fi
