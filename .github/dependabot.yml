version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker
  directories:
  - /
  - /agents/node-agent
  - /engines/netsvcs-dns
  - /engines/testserver
  - /hub_api
  - /portal
  - /services/hub-router
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: pip
  directories:
  - /
  - /engines/netsvcs-dns
  - /hub_api
  - /shared/py_libs
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  directories:
  - /portal
  - /shared/node_libs
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: cargo
  directories:
  - /agents/node-agent
  - /engines/testserver-rs
  - /services/hub-router-rs
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: gomod
  directories:
  - /engines/testserver
  - /services/hub-router
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
