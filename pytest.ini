[pytest]
# Pytest configuration for Tobogganing hub_api tests

# Test paths
testpaths = hub_api/tests

# Python files
python_files = test_*.py *_test.py

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Minimum Python version
minversion = 7.0

# Markers for pytest
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests

# Output options
addopts =
    -v
    --strict-markers
    --disable-warnings

# Coverage options (opt-in via make test-cov, not here by default)
# Do NOT add --cov or --cov-fail-under here; use 'make test-cov' for coverage reports
